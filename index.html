<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>개인용 이미지 스캐너</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #020617;
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overscroll-behavior: none;
    }

    header {
      padding: 14px 12px 8px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.04em;
    }

    .sub {
      margin-top: 5px;
      color: #94a3b8;
      font-size: 12px;
    }

    .toolbar,
    .editbar,
    .optionbar {
      position: sticky;
      z-index: 20;
      display: grid;
      gap: 8px;
      padding: 10px;
      background: rgba(2, 6, 23, 0.93);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(148, 163, 184, 0.22);
    }

    .toolbar {
      top: 0;
      grid-template-columns: 1fr 1fr;
    }

    .optionbar {
      top: 0;
      grid-template-columns: 1fr 1fr;
      padding-top: 0;
    }

    .editbar {
      display: none;
      top: 0;
      grid-template-columns: 1fr 1fr 1fr 1fr;
    }

    button,
    label,
    select {
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: linear-gradient(180deg, #1f2937, #111827);
      color: #e5e7eb;
      border-radius: 14px;
      padding: 12px 10px;
      font-size: 14px;
      font-weight: 800;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    select {
      width: 100%;
      text-align: left;
      appearance: none;
    }

    button.primary {
      background: linear-gradient(180deg, #0ea5e9, #0369a1);
      border-color: #7dd3fc;
    }

    button.good {
      background: linear-gradient(180deg, #22c55e, #15803d);
      border-color: #86efac;
    }

    button.warn {
      background: linear-gradient(180deg, #a16207, #854d0e);
      border-color: #facc15;
    }

    button.danger {
      background: linear-gradient(180deg, #be123c, #881337);
      border-color: #fb7185;
    }

    button:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    input[type="file"] { display: none; }

    .status {
      padding: 8px 14px;
      color: #bae6fd;
      font-size: 12px;
      min-height: 18px;
    }

    .progress {
      width: calc(100% - 20px);
      height: 8px;
      margin: 0 10px 8px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
      display: none;
    }

    .progress > div {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #22c55e);
      transition: width 0.16s;
    }

    .review {
      padding: 10px;
      display: grid;
      gap: 12px;
    }

    .empty {
      padding: 30px 14px;
      color: #94a3b8;
      text-align: center;
      font-size: 14px;
      line-height: 1.65;
    }

    .card {
      background: #0f172a;
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(0,0,0,0.28);
    }

    .card-head {
      padding: 10px 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.14);
    }

    .card-title {
      font-size: 13px;
      color: #cbd5e1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chip {
      font-size: 11px;
      color: #93c5fd;
      background: rgba(59, 130, 246, 0.14);
      border: 1px solid rgba(59, 130, 246, 0.32);
      border-radius: 999px;
      padding: 4px 8px;
      white-space: nowrap;
    }

    .image-wrap {
      position: relative;
      background: white;
    }

    .num-mark {
      position: absolute;
      left: 10px;
      top: 10px;
      min-width: 34px;
      height: 34px;
      padding: 0 10px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #facc15;
      color: #020617;
      border: 3px solid #020617;
      font-size: 17px;
      font-weight: 950;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      z-index: 3;
    }

    .card img {
      display: block;
      width: 100%;
      background: white;
    }

    .card-actions {
      padding: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .download-one {
      display: block;
      text-decoration: none;
      border: 1px solid rgba(134, 239, 172, 0.45);
      background: rgba(22, 163, 74, 0.18);
      color: #bbf7d0;
      border-radius: 14px;
      padding: 12px 10px;
      font-size: 14px;
      font-weight: 900;
      text-align: center;
    }

    .stage-wrap {
      display: none;
      padding: 10px;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 58vh;
      background: #000;
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 18px;
      overflow: hidden;
      touch-action: none;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #magnifier {
      position: fixed;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.75);
      background: rgba(0,0,0,0.18);
      z-index: 999;
      display: none;
      pointer-events: none;
      box-shadow: 0 8px 22px rgba(0,0,0,0.35);
      overflow: hidden;
      opacity: 0.72;
      backdrop-filter: blur(1px);
    }

    .save-view {
      display: none;
      padding: 10px;
      gap: 12px;
    }

    .save-view.show {
      display: grid;
    }

    .save-guide {
      background: rgba(56, 189, 248, 0.10);
      border: 1px solid rgba(56, 189, 248, 0.28);
      color: #dbeafe;
      border-radius: 16px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.55;
    }

    .save-photo {
      background: #0f172a;
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 18px;
      overflow: hidden;
    }

    .save-photo-head {
      padding: 10px 12px;
      color: #cbd5e1;
      font-size: 13px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.14);
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .save-photo img {
      display: block;
      width: 100%;
      background: white;
      -webkit-touch-callout: default;
      user-select: auto;
    }

    .hint {
      padding: 8px 14px 18px;
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.55;
    }
  </style>
</head>

<body>
<header>
  <h1>개인용 이미지 스캐너</h1>
  <div class="sub">여러 장 선택 → 자동보정 → 검수 → JPG 한번에 저장/공유</div>
</header>

<div class="toolbar" id="mainToolbar">
  <label for="fileInput">사진 여러 장 선택</label>
  <button id="cameraBtn">카메라 촬영</button>
  <button id="clearBtn" class="danger" disabled>초기화</button>
  <button id="shareBtn" class="good" disabled>한번에 저장/공유</button>
</div>

<div class="optionbar" id="optionbar">

  <select id="filterMode">
    <option value="auto">보정필터: 자동보정</option>
    <option value="vflat">보정필터: VFlat형 툴/표</option>
    <option value="camscanner">보정필터: 문서</option>
    <option value="original" selected>보정필터: 원본</option>
    <option value="bright">보정필터: 밝게</option>
    <option value="gray">보정필터: 흑백</option>
    <option value="deepgray">보정필터: 흑백 심화</option>
    <option value="sharp">보정필터: 선명하게</option>
    <option value="shadow">보정필터: 그림자 제거</option>
  </select>

  <select id="sizeMode">
    <option value="high">고용량: 고화질 3000px / JPG 92%</option>
    <option value="mid" selected>중용량: 표준 2000px / JPG 82%</option>
    <option value="low">저용량: 카톡용 1200px / JPG 70%</option>
  </select>

  <select id="detectMode">
    <option value="smart" selected>자동영역: 스캐너식</option>
    <option value="vflat">자동영역: VFlat형 툴/화면</option>
    <option value="camscanner">자동영역: 문서</option>
    <option value="paper">자동영역: 밝은 종이</option>
    <option value="edge">자동영역: 사각형/표선</option>
    <option value="a4">자동영역: 중앙 A4</option>
  </select>

  <button id="cycleDetectBtn" disabled>영역 후보 변경</button>
</div>
<input type="hidden" id="sortMode" value="selected" />
<button id="resortBtn" style="display:none" disabled>재정렬</button>

<div class="editbar" id="editToolbar">
  <button id="backBtn">검수 목록</button>
  <button id="autoBtn" class="warn">자동 영역</button>
  <button id="cycleEditBtn">후보 변경</button>
  <button id="saveEditBtn" class="good">수정</button>
</div>

<input id="fileInput" type="file" accept="image/*" multiple />
<input id="cameraInput" type="file" accept="image/*" capture="environment" />

<div class="status" id="status">OpenCV 로딩 중...</div>
<div class="progress" id="progress"><div id="progressBar"></div></div>

<div class="stage-wrap" id="stageWrap">
  <div class="stage" id="stage">
    <canvas id="canvas"></canvas>
  </div>
</div>

<canvas id="magnifier"></canvas>

<div class="review" id="reviewList">
  <div class="empty">
    사진을 여러 장 선택하면 자동으로 문서 영역을 잡고,<br>
    JPG 완료본이 이곳에 쌓입니다.
  </div>
</div>

<div class="save-view" id="saveView"></div>

<div class="hint">
  보정필터나 용량을 바꾸면 현재 결과물이 다시 처리됩니다.<br>
  틀린 사진만 <b>수정</b>을 눌러 꼭짓점을 조정한 뒤 <b>수정</b>하세요.
</div>

<script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvLoaded();"></script>

<script>
(() => {
  window.cvReady = false;

  window.onOpenCvLoaded = function () {
    if (typeof cv === "undefined") {
      setStatus("OpenCV 로딩 실패. 기본 A4 영역으로 작동합니다.");
      return;
    }

    cv["onRuntimeInitialized"] = () => {
      window.cvReady = true;
      setStatus("OpenCV 준비 완료. 사진을 선택하세요.");
    };
  };

  const mainToolbar = document.getElementById("mainToolbar");
  const optionbar = document.getElementById("optionbar");
  const editToolbar = document.getElementById("editToolbar");

  const stageWrap = document.getElementById("stageWrap");
  const stage = document.getElementById("stage");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const magnifier = document.getElementById("magnifier");
  const magCtx = magnifier.getContext("2d");

  const fileInput = document.getElementById("fileInput");
  const cameraInput = document.getElementById("cameraInput");
  const cameraBtn = document.getElementById("cameraBtn");
  const clearBtn = document.getElementById("clearBtn");
  const shareBtn = document.getElementById("shareBtn");

  const sortMode = document.getElementById("sortMode");
  const resortBtn = document.getElementById("resortBtn");
  const filterMode = document.getElementById("filterMode");
  const sizeMode = document.getElementById("sizeMode");
  const detectMode = document.getElementById("detectMode");
  const cycleDetectBtn = document.getElementById("cycleDetectBtn");

  const backBtn = document.getElementById("backBtn");
  const autoBtn = document.getElementById("autoBtn");
  const cycleEditBtn = document.getElementById("cycleEditBtn");
  const saveEditBtn = document.getElementById("saveEditBtn");

  const reviewList = document.getElementById("reviewList");
  const saveView = document.getElementById("saveView");
  const statusEl = document.getElementById("status");
  const progress = document.getElementById("progress");
  const progressBar = document.getElementById("progressBar");

  let items = [];
  let editIndex = -1;

  let img = new Image();
  let loaded = false;
  let imageW = 0;
  let imageH = 0;
  let view = { x: 0, y: 0, w: 0, h: 0, scale: 1 };
  let points = [];
  let dragging = -1;
  let detectCandidateIndex = 0;
  let detectCandidates = [];

  const sizeProfiles = {
    high: { maxSide: 3000, quality: 0.92 },
    mid: { maxSide: 2000, quality: 0.82 },
    low: { maxSide: 1200, quality: 0.70 }
  };

  function setStatus(text) {
    statusEl.textContent = text;
  }

  function setProgress(show, pct = 0) {
    progress.style.display = show ? "block" : "none";
    progressBar.style.width = `${pct}%`;
  }

  function resizeCanvas() {
    if (stageWrap.style.display === "none") return;

    const dpr = window.devicePixelRatio || 1;
    const r = stage.getBoundingClientRect();

    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    canvas.style.width = r.width + "px";
    canvas.style.height = r.height + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    magnifier.width = 90 * dpr;
    magnifier.height = 90 * dpr;
    magCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (loaded) fitView();
    draw();
  }

  function showReviewMode() {
    mainToolbar.style.display = "grid";
    optionbar.style.display = "grid";
    editToolbar.style.display = "none";
    stageWrap.style.display = "none";
    reviewList.style.display = "grid";
    saveView.classList.remove("show");
    hideMagnifier();
    renderReviewList();
  }

  function showEditMode(index) {
    editIndex = index;
    const item = items[index];
    if (!item) return;

    mainToolbar.style.display = "none";
    optionbar.style.display = "none";
    editToolbar.style.display = "grid";
    stageWrap.style.display = "block";
    reviewList.style.display = "none";
    saveView.classList.remove("show");

    img = new Image();
    img.onload = () => {
      imageW = img.naturalWidth;
      imageH = img.naturalHeight;
      loaded = true;
      points = item.points.map(p => ({ x: p.x, y: p.y }));

      resizeCanvas();
      fitView();
      draw();
      detectCandidateIndex = item.candidateIndex || 0;
      detectCandidates = getDocumentCandidates();
      setStatus(`${index + 1}/${items.length} 수정 중: ${item.name}`);
    };
    img.src = item.originalDataUrl;
  }

  function fitView() {
    const r = stage.getBoundingClientRect();
    const pad = 12;
    const scale = Math.min(
      (r.width - pad * 2) / imageW,
      (r.height - pad * 2) / imageH
    );

    view.scale = scale;
    view.w = imageW * scale;
    view.h = imageH * scale;
    view.x = (r.width - view.w) / 2;
    view.y = (r.height - view.h) / 2;
  }

  function imgToScreen(p) {
    return { x: view.x + p.x * view.scale, y: view.y + p.y * view.scale };
  }

  function screenToImg(x, y) {
    return {
      x: clamp((x - view.x) / view.scale, 0, imageW),
      y: clamp((y - view.y) / view.scale, 0, imageH)
    };
  }

  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  function draw() {
    if (stageWrap.style.display === "none") return;

    const r = stage.getBoundingClientRect();
    ctx.clearRect(0, 0, r.width, r.height);
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, r.width, r.height);

    if (!loaded) return;

    ctx.drawImage(img, view.x, view.y, view.w, view.h);

    const sp = points.map(imgToScreen);

    ctx.beginPath();
    ctx.moveTo(sp[0].x, sp[0].y);
    for (let i = 1; i < 4; i++) ctx.lineTo(sp[i].x, sp[i].y);
    ctx.closePath();
    ctx.fillStyle = "rgba(20,184,166,0.14)";
    ctx.fill();
    ctx.strokeStyle = "#14f1c8";
    ctx.lineWidth = 3;
    ctx.stroke();

    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.arc(sp[i].x, sp[i].y, 13, 0, Math.PI * 2);
      ctx.fillStyle = "#facc15";
      ctx.fill();
      ctx.strokeStyle = "#020617";
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = "#020617";
      ctx.font = "bold 12px -apple-system";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(i + 1, sp[i].x, sp[i].y);
    }
  }

  function showMagnifier(touchX, touchY, imgPoint) {
    const size = 90;
    const zoom = 0.45;
    const sourceSize = size / zoom;

    let left = touchX - size / 2;
    let top = touchY - size - 18;

    if (top < 10) top = touchY + 18;
    if (left < 8) left = 8;
    if (left + size > window.innerWidth - 8) left = window.innerWidth - size - 8;

    magnifier.style.width = size + "px";
    magnifier.style.height = size + "px";
    magnifier.style.left = left + "px";
    magnifier.style.top = top + "px";
    magnifier.style.display = "block";

    magCtx.clearRect(0, 0, size, size);
    magCtx.save();

    magCtx.beginPath();
    magCtx.arc(size / 2, size / 2, size / 2 - 3, 0, Math.PI * 2);
    magCtx.clip();

    magCtx.fillStyle = "#000";
    magCtx.fillRect(0, 0, size, size);

    magCtx.drawImage(
      img,
      imgPoint.x - sourceSize / 2,
      imgPoint.y - sourceSize / 2,
      sourceSize,
      sourceSize,
      0,
      0,
      size,
      size
    );

    magCtx.strokeStyle = "rgba(255,255,255,0.95)";
    magCtx.lineWidth = 1;

    magCtx.beginPath();
    magCtx.moveTo(size / 2, 0);
    magCtx.lineTo(size / 2, size);
    magCtx.moveTo(0, size / 2);
    magCtx.lineTo(size, size / 2);
    magCtx.stroke();

    magCtx.restore();
  }

  function hideMagnifier() {
    magnifier.style.display = "none";
  }

  function getPos(e) {
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return {
      x: t.clientX - r.left,
      y: t.clientY - r.top,
      pageX: t.clientX,
      pageY: t.clientY
    };
  }

  function nearestPoint(x, y) {
    let best = -1;
    let bestDist = Infinity;

    for (let i = 0; i < points.length; i++) {
      const p = imgToScreen(points[i]);
      const d = Math.hypot(p.x - x, p.y - y);

      if (d < bestDist) {
        bestDist = d;
        best = i;
      }
    }

    return bestDist <= 50 ? best : -1;
  }

  function onDown(e) {
    if (!loaded || editIndex < 0) return;
    e.preventDefault();

    const p = getPos(e);
    dragging = nearestPoint(p.x, p.y);

    if (dragging >= 0) showMagnifier(p.pageX, p.pageY, points[dragging]);
  }

  function onMove(e) {
    if (!loaded || dragging < 0 || editIndex < 0) return;
    e.preventDefault();

    const p = getPos(e);
    points[dragging] = screenToImg(p.x, p.y);
    draw();
    showMagnifier(p.pageX, p.pageY, points[dragging]);
  }

  function onUp() {
    dragging = -1;
    hideMagnifier();
  }

  canvas.addEventListener("mousedown", onDown);
  canvas.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);

  canvas.addEventListener("touchstart", onDown, { passive: false });
  canvas.addEventListener("touchmove", onMove, { passive: false });
  canvas.addEventListener("touchend", onUp, { passive: false });
  canvas.addEventListener("touchcancel", onUp, { passive: false });

  fileInput.addEventListener("change", e => processFiles(e.target.files));
  cameraInput.addEventListener("change", e => processFiles(e.target.files));
  cameraBtn.addEventListener("click", () => cameraInput.click());

  clearBtn.addEventListener("click", () => {
    items = [];
    editIndex = -1;
    loaded = false;
    clearBtn.disabled = true;
    shareBtn.disabled = true;
    resortBtn.disabled = true;
    cycleDetectBtn.disabled = true;
    setStatus("초기화 완료. 사진을 선택하세요.");
    showReviewMode();
  });

  resortBtn.addEventListener("click", () => {
    sortItems();
    renumberItems();
    renderReviewList();
    setStatus(`재정렬 완료: ${sortMode.options[sortMode.selectedIndex].text}`);
  });

  filterMode.addEventListener("change", reprocessAllResults);
  sizeMode.addEventListener("change", reprocessAllResults);

  detectMode.addEventListener("change", async () => {
    if (!items.length) return;
    setStatus("자동영역 방식 변경 반영 중...");
    await redetectAllResults();
  });

  cycleDetectBtn.addEventListener("click", async () => {
    if (!items.length) return;
    setStatus("다음 자동영역 후보 적용 중...");
    await cycleAllCandidates();
  });

  backBtn.addEventListener("click", showReviewMode);

  autoBtn.addEventListener("click", () => {
    if (editIndex < 0) return;
    detectCandidateIndex = 0;
    detectCandidates = getDocumentCandidates();
    points = detectCandidates.length ? detectCandidates[0].points.map(p => ({ x: p.x, y: p.y })) : makeA4CenterPoints();
    draw();
    setStatus(detectCandidates.length ? `자동영역 적용: ${detectCandidates[0].label}` : "중앙 A4 적용");
  });

  cycleEditBtn.addEventListener("click", cycleCurrentEditCandidate);

  saveEditBtn.addEventListener("click", async () => {
    if (editIndex < 0 || !items[editIndex]) return;

    await reprocessOneItem(editIndex, points);
    setStatus(`${editIndex + 1}번 수정 완료.`);
    showReviewMode();
  });

  shareBtn.addEventListener("click", shareOrShowSaveView);

  async function redetectAllResults() {
    if (!items.length) return;
    setProgress(true, 0);

    for (let i = 0; i < items.length; i++) {
      const image = await loadImage(items[i].originalDataUrl);
      img = image;
      imageW = image.naturalWidth;
      imageH = image.naturalHeight;
      loaded = true;

      points = autoDetectDocumentPoints();
      await reprocessOneItem(i, points);

      setProgress(true, Math.round(((i + 1) / items.length) * 100));
      await sleep(20);
    }

    renderReviewList();
    setProgress(false, 0);
    setStatus("자동영역 재적용 완료.");
  }

  async function cycleAllCandidates() {
    if (!items.length) return;
    setProgress(true, 0);

    for (let i = 0; i < items.length; i++) {
      const image = await loadImage(items[i].originalDataUrl);
      img = image;
      imageW = image.naturalWidth;
      imageH = image.naturalHeight;
      loaded = true;

      const candidates = getDocumentCandidates();
      if (candidates.length) {
        const nextIndex = ((items[i].candidateIndex || 0) + 1) % candidates.length;
        items[i].candidateIndex = nextIndex;
        await reprocessOneItem(i, candidates[nextIndex].points);
      }

      setProgress(true, Math.round(((i + 1) / items.length) * 100));
      await sleep(20);
    }

    renderReviewList();
    setProgress(false, 0);
    setStatus("다음 자동영역 후보 적용 완료.");
  }

  function cycleCurrentEditCandidate() {
    if (editIndex < 0 || !loaded) return;

    detectCandidates = getDocumentCandidates();
    if (!detectCandidates.length) {
      points = makeA4CenterPoints();
      draw();
      setStatus("후보가 없어 중앙 A4로 적용했습니다.");
      return;
    }

    detectCandidateIndex = (detectCandidateIndex + 1) % detectCandidates.length;
    points = detectCandidates[detectCandidateIndex].points.map(p => ({ x: p.x, y: p.y }));
    draw();

    setStatus(`영역 후보 ${detectCandidateIndex + 1}/${detectCandidates.length}: ${detectCandidates[detectCandidateIndex].label}`);
  }

  async function processFiles(fileList) {
    const selected = Array.from(fileList || []);
    if (!selected.length) return;

    items = [];
    reviewList.innerHTML = "";
    clearBtn.disabled = true;
    shareBtn.disabled = true;
    resortBtn.disabled = true;
    setProgress(true, 0);

    const orderedFiles = sortFileList(selected);

    for (let i = 0; i < orderedFiles.length; i++) {
      const file = orderedFiles[i];
      setStatus(`${i + 1}/${orderedFiles.length} 처리 중: ${file.name || "image"}`);

      const item = await processOneFile(file, i);
      items.push(item);
      renumberItems();
      setProgress(true, Math.round(((i + 1) / orderedFiles.length) * 100));
      renderReviewList();

      await sleep(40);
    }

    sortItems();
    renumberItems();
    renderReviewList();

    setProgress(false, 0);
    clearBtn.disabled = false;
    shareBtn.disabled = items.length === 0;
    resortBtn.disabled = items.length === 0;
    cycleDetectBtn.disabled = items.length === 0;
    setStatus(`${items.length}장 처리 완료. 필요한 사진만 수정하세요.`);
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function getFileTime(file) {
    return file?.lastModified || Date.now();
  }

  function sortFileList(list) {
    const mode = sortMode.value;
    const withOrder = list.map((file, idx) => ({ file, idx }));

    if (mode === "oldest") {
      withOrder.sort((a, b) => getFileTime(a.file) - getFileTime(b.file) || a.idx - b.idx);
    } else if (mode === "newest") {
      withOrder.sort((a, b) => getFileTime(b.file) - getFileTime(a.file) || a.idx - b.idx);
    } else if (mode === "name") {
      withOrder.sort((a, b) => String(a.file.name || "").localeCompare(String(b.file.name || ""), "ko") || a.idx - b.idx);
    } else {
      withOrder.sort((a, b) => a.idx - b.idx);
    }

    return withOrder.map(x => x.file);
  }

  function sortItems() {
    const mode = sortMode.value;

    if (mode === "oldest") {
      items.sort((a, b) => a.sourceTime - b.sourceTime || a.selectedOrder - b.selectedOrder);
    } else if (mode === "newest") {
      items.sort((a, b) => b.sourceTime - a.sourceTime || a.selectedOrder - b.selectedOrder);
    } else if (mode === "name") {
      items.sort((a, b) => String(a.name || "").localeCompare(String(b.name || ""), "ko") || a.selectedOrder - b.selectedOrder);
    } else {
      items.sort((a, b) => a.selectedOrder - b.selectedOrder);
    }
  }

  function renumberItems() {
    items.forEach((item, idx) => {
      item.number = idx + 1;
    });
  }

  function formatTime(ts) {
    const d = new Date(ts);
    const yy = String(d.getFullYear()).slice(2);
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    const dd = String(d.getDate()).padStart(2, "0");
    const hh = String(d.getHours()).padStart(2, "0");
    const mi = String(d.getMinutes()).padStart(2, "0");
    return `${yy}.${mm}.${dd} ${hh}:${mi}`;
  }

  function fileToDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function loadImage(dataUrl) {
    return new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve(image);
      image.onerror = reject;
      image.src = dataUrl;
    });
  }

  async function processOneFile(file, index) {
    const originalDataUrl = await fileToDataUrl(file);
    const image = await loadImage(originalDataUrl);

    img = image;
    imageW = image.naturalWidth;
    imageH = image.naturalHeight;
    loaded = true;

    points = autoDetectDocumentPoints();
    const result = makeDewarpDataUrl(points);

    return {
      name: file.name || `image_${index + 1}.jpg`,
      originalDataUrl,
      sourceTime: getFileTime(file),
      selectedOrder: index,
      number: index + 1,
      candidateIndex: 0,
      points: points.map(p => ({ x: p.x, y: p.y })),
      resultDataUrl: result.dataUrl,
      resultBlob: result.blob,
      resultSize: result.blob.size
    };
  }

  async function reprocessAllResults() {
    if (!items.length) return;

    setProgress(true, 0);
    setStatus("보정/용량 설정 반영 중...");

    for (let i = 0; i < items.length; i++) {
      await reprocessOneItem(i, items[i].points);
      setProgress(true, Math.round(((i + 1) / items.length) * 100));
      await sleep(20);
    }

    renderReviewList();
    setProgress(false, 0);
    setStatus("보정/용량 설정 반영 완료.");
  }

  async function reprocessOneItem(index, newPoints) {
    const item = items[index];
    if (!item) return;

    const image = await loadImage(item.originalDataUrl);

    img = image;
    imageW = image.naturalWidth;
    imageH = image.naturalHeight;
    loaded = true;

    const result = makeDewarpDataUrl(newPoints);

    item.points = newPoints.map(p => ({ x: p.x, y: p.y }));
    item.resultDataUrl = result.dataUrl;
    item.resultBlob = result.blob;
    item.resultSize = result.blob.size;
  }

  function renderReviewList() {
    if (!items.length) {
      reviewList.innerHTML = `
        <div class="empty">
          사진을 여러 장 선택하면 자동으로 문서 영역을 잡고,<br>
          JPG 완료본이 이곳에 쌓입니다.
        </div>
      `;
      return;
    }

        <div class="chip">${formatBytes(item.resultSize || 0)}</div>

      mark.className = "num-mark";

  async function rotateItem(index) {
    const item = items[index];
    if (!item) return;

    const image = await loadImage(item.originalDataUrl);
    const rotatedDataUrl = rotateImageDataUrl(image);
    item.originalDataUrl = rotatedDataUrl;

    const newImage = await loadImage(rotatedDataUrl);
    img = newImage;
    imageW = newImage.naturalWidth;
    imageH = newImage.naturalHeight;
    loaded = true;

    const newPoints = autoDetectDocumentPoints();
    await reprocessOneItem(index, newPoints);

    renderReviewList();
    setStatus(`${index + 1}번 회전 후 재처리 완료.`);
  }

  function rotateImageDataUrl(image) {
    const c = document.createElement("canvas");
    c.width = image.naturalHeight;
    c.height = image.naturalWidth;

    const cctx = c.getContext("2d");
    cctx.translate(c.width / 2, c.height / 2);
    cctx.rotate(Math.PI / 2);
    cctx.drawImage(image, -image.naturalWidth / 2, -image.naturalHeight / 2);

    return c.toDataURL("image/jpeg", 0.92);
  }

  function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, s => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[s]));
  }

  function formatBytes(bytes) {
    if (!bytes) return "-";
    if (bytes < 1024 * 1024) return `${Math.round(bytes / 1024)}KB`;
    return `${(bytes / (1024 * 1024)).toFixed(1)}MB`;
  }

  function makeOutputName(name, index) {
    const item = items[index];
    const number = item?.number || index + 1;
    const safe = (name || `image_${number}`).replace(/\.[^.]+$/, "");
    return `${String(number).padStart(3, "0")}_${safe}_scan.jpg`;
  }

  function autoDetectDocumentPoints() {
    const candidates = getDocumentCandidates();
    return candidates.length ? candidates[0].points : makeA4CenterPoints();
  }

  function getDocumentCandidates() {
    const mode = detectMode?.value || "smart";

    if (mode === "a4") {
      return [{ label: "중앙 A4", score: 0.1, points: makeA4CenterPoints() }];
    }

    const candidates = [];

    if (mode === "vflat") {
      // VFlat 모드: A4 종이가 아니라 엑셀/한글/웹툴 같은 프로그램 화면 안쪽 작업영역을 우선 탐지
      candidates.push(...detectByExcelToolInnerArea().map(c => ({ ...c, score: c.score + 0.55 })));
      candidates.push(...detectByTableAndRectangleLines().map(c => ({ ...c, score: c.score + 0.28 })));
      candidates.push(...detectByBrightBoxProjection().map(c => ({ ...c, score: c.score + 0.12 })));
      candidates.push(...makeCenterCropCandidates().map(c => ({ ...c, score: c.score + 0.05 })));
    } else if (mode === "camscanner") {
      // 문서 모드:
      // 회색 바탕 안의 큰 흰색 슬라이드를 찾는다.
      // 실패하면 기본 좌표로 fallback.
      candidates.push({ label: "회색 바탕 속 흰 슬라이드", score: 10.0, points: detectWhiteSlideOnGrayBackground() });
      candidates.push({ label: "문서 기본 좌표", score: 8.0, points: makeDocumentPresetPoints() });

      // 기존 탐지는 후보 변경용 보조로만 유지
      candidates.push(...detectByPaperMask().map(c => ({ ...c, score: c.score + 0.10 })));
      candidates.push(...detectByOuterEdges().map(c => ({ ...c, score: c.score + 0.08 })));
      candidates.push({ label: "중앙 A4", score: 0.01, points: makeA4CenterPoints() });
    } else {
      if (mode === "smart" || mode === "paper") {
        candidates.push(...detectByPaperMask());
        candidates.push(...detectByBrightBoxProjection());
      }

      if (mode === "smart" || mode === "edge") {
        candidates.push(...detectByOuterEdges());
        candidates.push(...detectByTableAndRectangleLines());
      }
    }

    // 정책표/엑셀 화면용 백업 후보
    candidates.push(...makeCenterCropCandidates());
    candidates.push({ label: "중앙 A4", score: 0.01, points: makeA4CenterPoints() });

    return dedupeCandidates(candidates)
      .filter(c => isValidQuad(c.points))
      .sort((a, b) => b.score - a.score)
      .slice(0, 10);
  }

  function detectByPaperMask() {
    const maxSide = 820;
    const scale = Math.min(maxSide / imageW, maxSide / imageH, 1);
    const w = Math.round(imageW * scale);
    const h = Math.round(imageH * scale);

    const temp = document.createElement("canvas");
    temp.width = w;
    temp.height = h;

    const tctx = temp.getContext("2d", { willReadFrequently: true });
    tctx.drawImage(img, 0, 0, w, h);

    const imgData = tctx.getImageData(0, 0, w, h);
    const data = imgData.data;

    const gray = new Uint8Array(w * h);
    let sum = 0;
    let sumSq = 0;

    for (let i = 0, p = 0; i < data.length; i += 4, p++) {
      const v = Math.round(0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]);
      gray[p] = v;
      sum += v;
      sumSq += v * v;
    }

    const mean = sum / gray.length;
    const variance = Math.max(0, sumSq / gray.length - mean * mean);
    const std = Math.sqrt(variance);

    const thresholds = [
      Math.max(82, mean + std * 0.00),
      Math.max(96, mean + std * 0.16),
      Math.max(112, mean + std * 0.32),
      Math.max(128, mean + std * 0.50),
      Math.max(144, mean + std * 0.68)
    ];

    const candidates = [];

    for (const th of thresholds) {
      const mask = new Uint8Array(w * h);

      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const idx = y * w + x;
          if (gray[idx] >= th) mask[idx] = 1;
        }
      }

      closeMask(mask, w, h, 3);
      removeIsolatedNoise(mask, w, h);

      const comps = connectedComponents(mask, w, h, 8);

      for (const comp of comps) {
        const bw = comp.maxX - comp.minX + 1;
        const bh = comp.maxY - comp.minY + 1;
        const boxRatio = (bw * bh) / (w * h);
        const areaRatio = comp.count / (w * h);

        if (bw < w * 0.18 || bh < h * 0.18) continue;
        if (boxRatio > 0.985) continue;

        let pts = [
          { x: comp.minX / scale, y: comp.minY / scale },
          { x: comp.maxX / scale, y: comp.minY / scale },
          { x: comp.maxX / scale, y: comp.maxY / scale },
          { x: comp.minX / scale, y: comp.maxY / scale }
        ];

        pts = expandPoints(pts, imageW, imageH, 0.008);

        const a4 = a4RatioScore(pts);
        const rect = rectangleScore(pts);
        const center = centerBiasScore(pts);
        const fill = Math.min(1.35, areaRatio / Math.max(0.001, boxRatio));
        const sizeScore = Math.min(1.35, boxRatio * 2.4);
        const score = 0.30 * a4 + 0.24 * rect + 0.20 * center + 0.15 * fill + 0.11 * sizeScore;

        candidates.push({ label: `밝은 면적 ${Math.round(th)}`, score, points: pts });
      }
    }

    return candidates;
  }

  function detectByBrightBoxProjection() {
    const maxSide = 780;
    const scale = Math.min(maxSide / imageW, maxSide / imageH, 1);
    const w = Math.round(imageW * scale);
    const h = Math.round(imageH * scale);

    const temp = document.createElement("canvas");
    temp.width = w;
    temp.height = h;

    const tctx = temp.getContext("2d", { willReadFrequently: true });
    tctx.drawImage(img, 0, 0, w, h);

    const data = tctx.getImageData(0, 0, w, h).data;
    const row = new Array(h).fill(0);
    const col = new Array(w).fill(0);

    let total = 0;
    let count = 0;

    for (let i = 0; i < data.length; i += 4) {
      total += (data[i] + data[i + 1] + data[i + 2]) / 3;
      count++;
    }

    const avg = total / Math.max(1, count);
    const threshold = Math.max(95, avg + 8);

    for (let y = 0; y < h; y += 2) {
      for (let x = 0; x < w; x += 2) {
        const i = (y * w + x) * 4;
        const r = data[i], g = data[i + 1], b = data[i + 2];
        const v = (r + g + b) / 3;
        const diff = Math.max(r, g, b) - Math.min(r, g, b);

        if (v > threshold && diff < 130) {
          row[y]++;
          col[x]++;
        }
      }
    }

    smoothArray(row, 7);
    smoothArray(col, 7);

    const rowRanges = getRangesFromProjection(row, w * 0.08, h);
    const colRanges = getRangesFromProjection(col, h * 0.08, w);

    const candidates = [];

    for (const yr of rowRanges.slice(0, 4)) {
      for (const xr of colRanges.slice(0, 4)) {
        const bw = xr.end - xr.start;
        const bh = yr.end - yr.start;
        if (bw < w * 0.20 || bh < h * 0.20) continue;

        const pts = expandPoints([
          { x: xr.start / scale, y: yr.start / scale },
          { x: xr.end / scale, y: yr.start / scale },
          { x: xr.end / scale, y: yr.end / scale },
          { x: xr.start / scale, y: yr.end / scale }
        ], imageW, imageH, 0.004);

        const boxRatio = (bw * bh) / (w * h);
        const score = 0.30 * a4RatioScore(pts) + 0.30 * rectangleScore(pts) + 0.25 * centerBiasScore(pts) + 0.15 * Math.min(1.3, boxRatio * 2.2);

        candidates.push({ label: "밝은 박스 투영", score, points: pts });
      }
    }

    return candidates;
  }

  function detectByExcelToolInnerArea() {
    // 엑셀/한글/웹툴 화면용.
    // 목표: 사진 안의 모니터/프로그램 창 중에서 리본, 표, 메뉴가 포함된 "툴 안쪽 작업영역" 외곽을 잡는다.
    // A4 비율보다 넓은 화면형 사각형과 표선 밀도를 더 높게 평가한다.
    const maxSide = 900;
    const scale = Math.min(maxSide / imageW, maxSide / imageH, 1);
    const w = Math.round(imageW * scale);
    const h = Math.round(imageH * scale);

    const temp = document.createElement("canvas");
    temp.width = w;
    temp.height = h;

    const tctx = temp.getContext("2d", { willReadFrequently: true });
    tctx.drawImage(img, 0, 0, w, h);

    const data = tctx.getImageData(0, 0, w, h).data;

    const gray = new Uint8Array(w * h);
    const workMask = new Uint8Array(w * h);
    const lineMask = new Uint8Array(w * h);

    let sum = 0;

    for (let i = 0, p = 0; i < data.length; i += 4, p++) {
      const r = data[i];
      const g = data[i + 1];
      const b = data[i + 2];
      const v = Math.round(0.299 * r + 0.587 * g + 0.114 * b);
      const colorDiff = Math.max(r, g, b) - Math.min(r, g, b);

      gray[p] = v;
      sum += v;

      // 엑셀/툴 내부는 대체로 검은 배경보다 밝고, 모니터 색 편차가 과하지 않음
      if (v > 72 && colorDiff < 145) {
        workMask[p] = 1;
      }
    }

    const avg = sum / Math.max(1, gray.length);

    // 표선/텍스트 밀도 추정: 어두운 선, 격자, 문자 영역
    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        const idx = y * w + x;
        const v = gray[idx];

        const gx = Math.abs(gray[idx + 1] - gray[idx - 1]);
        const gy = Math.abs(gray[idx + w] - gray[idx - w]);

        if ((gx + gy > 24 && v < avg + 45) || v < 118) {
          lineMask[idx] = 1;
        }
      }
    }

    closeMask(workMask, w, h, 2);

    const rowWork = new Array(h).fill(0);
    const colWork = new Array(w).fill(0);
    const rowLine = new Array(h).fill(0);
    const colLine = new Array(w).fill(0);

    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const idx = y * w + x;

        if (workMask[idx]) {
          rowWork[y]++;
          colWork[x]++;
        }

        if (lineMask[idx]) {
          rowLine[y]++;
          colLine[x]++;
        }
      }
    }

    smoothArray(rowWork, 9);
    smoothArray(colWork, 9);
    smoothArray(rowLine, 7);
    smoothArray(colLine, 7);

    const candidates = [];

    // 1) 밝은 툴 내부 전체 범위
    const workRows = getRangesFromProjection(rowWork, w * 0.34, h);
    const workCols = getRangesFromProjection(colWork, h * 0.34, w);

    for (const yr of workRows.slice(0, 3)) {
      for (const xr of workCols.slice(0, 3)) {
        addToolCandidate(candidates, xr.start, yr.start, xr.end, yr.end, scale, "툴 내부 밝은 영역", 0.26);
      }
    }

    // 2) 표/셀/문자 밀도가 높은 작업영역
    const lineRows = getRangesFromProjection(rowLine, w * 0.045, h);
    const lineCols = getRangesFromProjection(colLine, h * 0.045, w);

    for (const yr of lineRows.slice(0, 4)) {
      for (const xr of lineCols.slice(0, 4)) {
        const padX = Math.round((xr.end - xr.start) * 0.04);
        const padY = Math.round((yr.end - yr.start) * 0.06);

        addToolCandidate(
          candidates,
          Math.max(0, xr.start - padX),
          Math.max(0, yr.start - padY),
          Math.min(w - 1, xr.end + padX),
          Math.min(h - 1, yr.end + padY),
          scale,
          "툴 내부 표/셀 영역",
          0.34
        );
      }
    }

    // 3) 컴포넌트 기반: 사진의 어두운 배경을 제외한 가장 큰 화면/툴 덩어리
    const comps = connectedComponents(workMask, w, h, 8);

    for (const comp of comps) {
      addToolCandidate(
        candidates,
        comp.minX,
        comp.minY,
        comp.maxX,
        comp.maxY,
        scale,
        "툴/화면 컴포넌트",
        0.22
      );
    }

    return candidates;
  }

  function addToolCandidate(candidates, x0, y0, x1, y1, scale, label, baseScore) {
    const bw = x1 - x0;
    const bh = y1 - y0;

    if (bw <= 0 || bh <= 0) return;

    const boxRatio = (bw * bh) / ((imageW * scale) * (imageH * scale));

    // 엑셀/툴 화면은 보통 넓은 사각형이므로 너무 좁은 후보는 버림
    if (boxRatio < 0.10 || boxRatio > 0.985) return;

    let pts = [
      { x: x0 / scale, y: y0 / scale },
      { x: x1 / scale, y: y0 / scale },
      { x: x1 / scale, y: y1 / scale },
      { x: x0 / scale, y: y1 / scale }
    ];

    pts = expandPoints(pts, imageW, imageH, 0.006);

    const wideScore = wideToolRatioScore(pts);
    const rectScore = rectangleScore(pts);
    const centerScore = centerBiasScore(pts);
    const sizeScore = Math.min(1.45, boxRatio * 2.35);

    const score =
      baseScore +
      0.34 * wideScore +
      0.28 * rectScore +
      0.20 * centerScore +
      0.18 * sizeScore;

    candidates.push({ label, score, points: pts });
  }

  function wideToolRatioScore(pts) {
    const q = orderPoints(pts);
    const w1 = dist(q[0], q[1]);
    const w2 = dist(q[3], q[2]);
    const h1 = dist(q[0], q[3]);
    const h2 = dist(q[1], q[2]);

    const ww = Math.max(1, (w1 + w2) / 2);
    const hh = Math.max(1, (h1 + h2) / 2);
    const ratio = ww / hh;

    // 엑셀/프로그램 화면형은 가로로 긴 사각형을 우선
    const targets = [1.25, 1.45, 1.60, 1.78, 2.0, 2.35];

    let best = 0.45;

    for (const target of targets) {
      const diff = Math.abs(ratio - target);
      let score;
      if (diff < 0.14) score = 1.45;
      else if (diff < 0.28) score = 1.20;
      else if (diff < 0.48) score = 0.95;
      else if (diff < 0.75) score = 0.70;
      else score = 0.45;

      best = Math.max(best, score);
    }

    return best;
  }

  function detectByTableAndRectangleLines() {
    if (!window.cvReady) return [];

    const maxSide = 1200;
    const scale = Math.min(maxSide / imageW, maxSide / imageH, 1);
    const w = Math.round(imageW * scale);
    const h = Math.round(imageH * scale);

    const temp = document.createElement("canvas");
    temp.width = w;
    temp.height = h;

    const tctx = temp.getContext("2d", { willReadFrequently: true });
    tctx.drawImage(img, 0, 0, w, h);

    let src = cv.imread(temp);
    let gray = new cv.Mat();
    let blur = new cv.Mat();
    let edges = new cv.Mat();
    let closed = new cv.Mat();
    let kernelClose = cv.Mat.ones(9, 9, cv.CV_8U);
    let contours = new cv.MatVector();
    let hierarchy = new cv.Mat();

    const candidates = [];

    try {
      cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
      cv.GaussianBlur(gray, blur, new cv.Size(3, 3), 0);
      cv.Canny(blur, edges, 25, 100);
      cv.morphologyEx(edges, closed, cv.MORPH_CLOSE, kernelClose);

      cv.findContours(closed, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

      const imageArea = w * h;

      for (let i = 0; i < contours.size(); i++) {
        const cnt = contours.get(i);
        const area = cv.contourArea(cnt);

        if (area < imageArea * 0.015 || area > imageArea * 0.99) {
          cnt.delete();
          continue;
        }

        const rect = cv.boundingRect(cnt);
        const bw = rect.width;
        const bh = rect.height;
        const boxArea = bw * bh;

        if (bw < w * 0.16 || bh < h * 0.12) {
          cnt.delete();
          continue;
        }

        const extent = area / Math.max(1, boxArea);
        const pts = expandPoints([
          { x: rect.x / scale, y: rect.y / scale },
          { x: (rect.x + rect.width) / scale, y: rect.y / scale },
          { x: (rect.x + rect.width) / scale, y: (rect.y + rect.height) / scale },
          { x: rect.x / scale, y: (rect.y + rect.height) / scale }
        ], imageW, imageH, 0.006);

        const boxRatio = boxArea / imageArea;
        const lineScore = estimateGridLineScore(temp, rect);
        const score =
          0.25 * rectangleScore(pts) +
          0.24 * centerBiasScore(pts) +
          0.22 * Math.min(1.4, boxRatio * 2.1) +
          0.18 * Math.min(1.4, lineScore) +
          0.11 * Math.min(1.2, extent * 1.8);

        candidates.push({ label: "표/사각형 박스", score, points: pts });

        cnt.delete();
      }
    } finally {
      src.delete();
      gray.delete();
      blur.delete();
      edges.delete();
      closed.delete();
      kernelClose.delete();
      contours.delete();
      hierarchy.delete();
    }

    return candidates;
  }

  function estimateGridLineScore(canvasEl, rect) {
    const ctx2 = canvasEl.getContext("2d", { willReadFrequently: true });
    const w = canvasEl.width;
    const h = canvasEl.height;
    const data = ctx2.getImageData(0, 0, w, h).data;

    const x0 = Math.max(0, rect.x);
    const y0 = Math.max(0, rect.y);
    const x1 = Math.min(w - 1, rect.x + rect.width);
    const y1 = Math.min(h - 1, rect.y + rect.height);

    const sampleRows = 24;
    const sampleCols = 24;
    let verticalTransitions = 0;
    let horizontalTransitions = 0;

    for (let s = 0; s < sampleRows; s++) {
      const y = Math.round(y0 + (y1 - y0) * (s + 0.5) / sampleRows);
      let prev = null;
      for (let x = x0; x <= x1; x += 3) {
        const i = (y * w + x) * 4;
        const v = (data[i] + data[i + 1] + data[i + 2]) / 3;
        const dark = v < 155;
        if (prev !== null && prev !== dark) verticalTransitions++;
        prev = dark;
      }
    }

    for (let s = 0; s < sampleCols; s++) {
      const x = Math.round(x0 + (x1 - x0) * (s + 0.5) / sampleCols);
      let prev = null;
      for (let y = y0; y <= y1; y += 3) {
        const i = (y * w + x) * 4;
        const v = (data[i] + data[i + 1] + data[i + 2]) / 3;
        const dark = v < 155;
        if (prev !== null && prev !== dark) horizontalTransitions++;
        prev = dark;
      }
    }

    return Math.min(1.5, (verticalTransitions + horizontalTransitions) / 900);
  }

  function detectByOuterEdges() {
    if (!window.cvReady) return [];

    const maxSide = 1100;
    const scale = Math.min(maxSide / imageW, maxSide / imageH, 1);
    const w = Math.round(imageW * scale);
    const h = Math.round(imageH * scale);

    const temp = document.createElement("canvas");
    temp.width = w;
    temp.height = h;

    const tctx = temp.getContext("2d", { willReadFrequently: true });
    tctx.drawImage(img, 0, 0, w, h);

    let src = cv.imread(temp);
    let gray = new cv.Mat();
    let blur = new cv.Mat();
    let edges = new cv.Mat();
    let kernel = cv.Mat.ones(7, 7, cv.CV_8U);
    let contours = new cv.MatVector();
    let hierarchy = new cv.Mat();

    const candidates = [];

    try {
      cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
      cv.GaussianBlur(gray, blur, new cv.Size(7, 7), 0);
      cv.Canny(blur, edges, 35, 115);
      cv.dilate(edges, edges, kernel);
      cv.erode(edges, edges, kernel);

      cv.findContours(edges, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

      const imageArea = w * h;

      for (let i = 0; i < contours.size(); i++) {
        const cnt = contours.get(i);
        const area = cv.contourArea(cnt);

        if (area < imageArea * 0.06 || area > imageArea * 0.99) {
          cnt.delete();
          continue;
        }

        const peri = cv.arcLength(cnt, true);

        for (const eps of [0.012, 0.018, 0.025, 0.035, 0.05, 0.07]) {
          const approx = new cv.Mat();
          cv.approxPolyDP(cnt, approx, eps * peri, true);

          if (approx.rows === 4) {
            const pts = matToPoints(approx).map(p => ({ x: p.x / scale, y: p.y / scale }));
            const q = expandPoints(orderPoints(pts), imageW, imageH, 0.006);

            const areaScore = Math.min(1.4, quadArea(q) / (imageW * imageH) * 2.0);
            const ratioScore = a4RatioScore(q);
            const rectScore = rectangleScore(q);
            const centerScore = centerBiasScore(q);
            const score = areaScore * 0.32 + ratioScore * 0.25 + rectScore * 0.25 + centerScore * 0.18;

            candidates.push({ label: `외곽선 ${eps}`, score, points: q });
          }

          approx.delete();
        }

        cnt.delete();
      }
    } finally {
      src.delete();
      gray.delete();
      blur.delete();
      edges.delete();
      kernel.delete();
      contours.delete();
      hierarchy.delete();
    }

    return candidates;
  }

  function makeDocumentPresetPoints() {
    // fallback용 넓은 문서 기본 좌표.
    const left = imageW * 0.045;
    const right = imageW * 0.955;
    const top = imageH * 0.035;
    const bottom = imageH * 0.930;

    return [
      { x: left, y: top },
      { x: right, y: top },
      { x: right, y: bottom },
      { x: left, y: bottom }
    ];
  }

  function detectWhiteSlideOnGrayBackground() {
    // 핵심 규칙:
    // 사진에는 회색 바탕이 있고, 그 안에 큰 흰색 슬라이드가 있다.
    // 그래서 내부 표선/대외비/텍스트가 아니라 "큰 흰 면"의 바깥 경계를 찾는다.
    const fallback = makeDocumentPresetPoints();

    try {
      const maxSide = 760;
      const scale = Math.min(maxSide / imageW, maxSide / imageH, 1);
      const w = Math.max(1, Math.round(imageW * scale));
      const h = Math.max(1, Math.round(imageH * scale));

      const temp = document.createElement("canvas");
      temp.width = w;
      temp.height = h;

      const tctx = temp.getContext("2d", { willReadFrequently: true });
      tctx.drawImage(img, 0, 0, w, h);

      const data = tctx.getImageData(0, 0, w, h).data;

      const grayBg = estimateOuterGrayBackground(data, w, h);
      const whiteThreshold = Math.max(142, grayBg + 20);

      const row = new Array(h).fill(0);
      const col = new Array(w).fill(0);

      // 위쪽 리본/아래 검정바 영향을 줄이되, 슬라이드가 위에 붙는 경우도 고려해 넓게 스캔
      const scanLeft = Math.round(w * 0.01);
      const scanRight = Math.round(w * 0.99);
      const scanTop = Math.round(h * 0.04);
      const scanBottom = Math.round(h * 0.97);

      for (let y = scanTop; y < scanBottom; y += 2) {
        for (let x = scanLeft; x < scanRight; x += 2) {
          const i = (y * w + x) * 4;
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];

          const v = (r + g + b) / 3;
          const diff = Math.max(r, g, b) - Math.min(r, g, b);

          // 흰 슬라이드: 회색 바탕보다 밝고 색 편차가 크지 않다.
          // 빨간 대외비, 노란 안내바, 파란 글씨는 diff가 커서 제외된다.
          if (v >= whiteThreshold && diff < 105) {
            row[y] += 2;
            col[x] += 2;
          }
        }
      }

      smoothArray(row, 9);
      smoothArray(col, 9);

      // 흰 슬라이드는 화면에서 넓은 연속 구간을 만든다.
      let yr = largestContinuousRange(row, w * 0.38, Math.round(h * 0.35));
      let xr = largestContinuousRange(col, h * 0.30, Math.round(w * 0.35));

      // 흐린 사진용 완화
      if (!yr) yr = largestContinuousRange(row, w * 0.28, Math.round(h * 0.28));
      if (!xr) xr = largestContinuousRange(col, h * 0.22, Math.round(w * 0.28));

      if (!yr || !xr) return fallback;

      let x0 = Math.max(0, xr.start - 4);
      let x1 = Math.min(w - 1, xr.end + 4);
      let y0 = Math.max(0, yr.start - 4);
      let y1 = Math.min(h - 1, yr.end + 4);

      // 너무 작거나 말도 안 되는 박스는 버림
      if ((x1 - x0) < w * 0.50 || (y1 - y0) < h * 0.45) return fallback;
      if ((x1 - x0) > w * 0.98 || (y1 - y0) > h * 0.98) return fallback;

      return [
        { x: x0 / scale, y: y0 / scale },
        { x: x1 / scale, y: y0 / scale },
        { x: x1 / scale, y: y1 / scale },
        { x: x0 / scale, y: y1 / scale }
      ];
    } catch (err) {
      console.warn("white slide detect failed", err);
      return fallback;
    }
  }

  function estimateOuterGrayBackground(data, w, h) {
    const vals = [];

    const sample = (x, y) => {
      x = clamp(Math.round(x), 0, w - 1);
      y = clamp(Math.round(y), 0, h - 1);
      const i = (y * w + x) * 4;
      const r = data[i];
      const g = data[i + 1];
      const b = data[i + 2];
      const v = (r + g + b) / 3;
      const diff = Math.max(r, g, b) - Math.min(r, g, b);

      // 회색 바탕 후보: 너무 어둡거나 너무 흰 영역은 제외
      if (v > 75 && v < 220 && diff < 80) vals.push(v);
    };

    // 가장자리와 화면 주변부에서 회색 바탕 샘플링
    for (let x = 0; x < w; x += 10) {
      sample(x, h * 0.08);
      sample(x, h * 0.94);
    }

    for (let y = 0; y < h; y += 10) {
      sample(w * 0.035, y);
      sample(w * 0.965, y);
    }

    if (!vals.length) return 135;

    vals.sort((a, b) => a - b);

    // 중앙값보다 약간 밝은 쪽을 회색 바탕 기준으로 사용
    return vals[Math.floor(vals.length * 0.58)];
  }

  function largestContinuousRange(arr, threshold, minLen) {
    let best = null;
    let start = -1;

    for (let i = 0; i <= arr.length; i++) {
      const active = i < arr.length && arr[i] >= threshold;

      if (active && start < 0) {
        start = i;
      }

      if ((!active || i === arr.length) && start >= 0) {
        const end = i - 1;
        const len = end - start + 1;

        if (len >= minLen) {
          if (!best || len > best.end - best.start + 1) {
            best = { start, end };
          }
        }

        start = -1;
      }
    }

    return best;
  }

  function makeCenterCropCandidates() {
    const candidates = [];
    const specs = [
      { label: "중앙 넓은 사각", w: 0.90, h: 0.72, score: 0.16 },
      { label: "중앙 표 영역", w: 0.86, h: 0.58, score: 0.14 },
      { label: "중앙 A4 가로", w: 0.84, h: 0.59, score: 0.12 },
      { label: "중앙 A4 세로", w: 0.58, h: 0.82, score: 0.10 }
    ];

    for (const s of specs) {
      const bw = imageW * s.w;
      const bh = imageH * s.h;
      const left = (imageW - bw) / 2;
      const top = (imageH - bh) / 2;

      candidates.push({
        label: s.label,
        score: s.score,
        points: [
          { x: left, y: top },
          { x: left + bw, y: top },
          { x: left + bw, y: top + bh },
          { x: left, y: top + bh }
        ]
      });
    }

    return candidates;
  }

  function closeMask(mask, w, h, iterations) {
    for (let k = 0; k < iterations; k++) dilateMask(mask, w, h);
    for (let k = 0; k < iterations; k++) erodeMask(mask, w, h);
  }

  function dilateMask(mask, w, h) {
    const copy = mask.slice();

    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        const idx = y * w + x;
        if (copy[idx]) continue;

        if (
          copy[idx - 1] || copy[idx + 1] ||
          copy[idx - w] || copy[idx + w] ||
          copy[idx - w - 1] || copy[idx - w + 1] ||
          copy[idx + w - 1] || copy[idx + w + 1]
        ) mask[idx] = 1;
      }
    }
  }

  function erodeMask(mask, w, h) {
    const copy = mask.slice();

    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        const idx = y * w + x;
        if (!copy[idx]) continue;

        if (!copy[idx - 1] || !copy[idx + 1] || !copy[idx - w] || !copy[idx + w]) {
          mask[idx] = 0;
        }
      }
    }
  }

  function removeIsolatedNoise(mask, w, h) {
    const copy = mask.slice();

    for (let y = 2; y < h - 2; y++) {
      for (let x = 2; x < w - 2; x++) {
        const idx = y * w + x;
        if (!copy[idx]) continue;

        let count = 0;
        for (let yy = -2; yy <= 2; yy++) {
          for (let xx = -2; xx <= 2; xx++) {
            count += copy[(y + yy) * w + (x + xx)];
          }
        }

        if (count <= 5) mask[idx] = 0;
      }
    }
  }

  function connectedComponents(mask, w, h, maxComponents) {
    const visited = new Uint8Array(w * h);
    const comps = [];

    for (let y = 0; y < h; y += 2) {
      for (let x = 0; x < w; x += 2) {
        const start = y * w + x;
        if (!mask[start] || visited[start]) continue;

        const queue = [start];
        visited[start] = 1;

        let head = 0;
        let minX = x, maxX = x, minY = y, maxY = y;
        let count = 0;

        while (head < queue.length) {
          const idx = queue[head++];
          const cx = idx % w;
          const cy = Math.floor(idx / w);

          count++;
          if (cx < minX) minX = cx;
          if (cx > maxX) maxX = cx;
          if (cy < minY) minY = cy;
          if (cy > maxY) maxY = cy;

          const neighbors = [idx - 1, idx + 1, idx - w, idx + w];

          for (const n of neighbors) {
            if (n < 0 || n >= mask.length) continue;
            if (visited[n] || !mask[n]) continue;

            const nx = n % w;
            const ny = Math.floor(n / w);
            if (Math.abs(nx - cx) + Math.abs(ny - cy) !== 1) continue;

            visited[n] = 1;
            queue.push(n);
          }
        }

        if (count > w * h * 0.010) comps.push({ minX, minY, maxX, maxY, count });
      }
    }

    comps.sort((a, b) => b.count - a.count);
    return comps.slice(0, maxComponents);
  }

  function getRangesFromProjection(arr, threshold, totalLen) {
    const ranges = [];
    let inRange = false;
    let start = 0;

    for (let i = 0; i < arr.length; i++) {
      if (!inRange && arr[i] > threshold) {
        start = i;
        inRange = true;
      } else if (inRange && arr[i] <= threshold) {
        if (i - start > totalLen * 0.10) ranges.push({ start, end: i });
        inRange = false;
      }
    }

    if (inRange && arr.length - start > totalLen * 0.10) {
      ranges.push({ start, end: arr.length - 1 });
    }

    ranges.sort((a, b) => (b.end - b.start) - (a.end - a.start));
    return ranges.slice(0, 5);
  }

  function smoothArray(arr, radius) {
    const copy = arr.slice();

    for (let i = 0; i < arr.length; i++) {
      let sum = 0;
      let count = 0;

      for (let j = -radius; j <= radius; j++) {
        const idx = i + j;
        if (idx < 0 || idx >= arr.length) continue;
        sum += copy[idx];
        count++;
      }

      arr[i] = sum / Math.max(1, count);
    }
  }

  function dedupeCandidates(candidates) {
    const out = [];

    for (const cand of candidates) {
      const q = orderPoints(cand.points);
      const area = quadArea(q);
      if (area < imageW * imageH * 0.035) continue;

      let duplicate = false;

      for (const existing of out) {
        const e = orderPoints(existing.points);
        const d = averagePointDistance(q, e);

        if (d < Math.max(imageW, imageH) * 0.035) {
          duplicate = true;
          if (cand.score > existing.score) {
            existing.points = q;
            existing.score = cand.score;
            existing.label = cand.label;
          }
          break;
        }
      }

      if (!duplicate) out.push({ ...cand, points: q });
    }

    return out;
  }

  function averagePointDistance(a, b) {
    let total = 0;
    for (let i = 0; i < 4; i++) total += dist(a[i], b[i]);
    return total / 4;
  }

  function matToPoints(mat) {
    const pts = [];
    for (let i = 0; i < mat.rows; i++) {
      pts.push({ x: mat.data32S[i * 2], y: mat.data32S[i * 2 + 1] });
    }
    return pts;
  }

  function isValidQuad(pts) {
    const q = orderPoints(pts);
    const area = quadArea(q);
    if (area < imageW * imageH * 0.035) return false;
    if (area > imageW * imageH * 0.992) return false;

    const w1 = dist(q[0], q[1]);
    const w2 = dist(q[3], q[2]);
    const h1 = dist(q[0], q[3]);
    const h2 = dist(q[1], q[2]);

    if (Math.min(w1, w2, h1, h2) < Math.max(imageW, imageH) * 0.05) return false;
    return true;
  }

  function quadArea(q) {
    let area = 0;
    for (let i = 0; i < q.length; i++) {
      const p1 = q[i];
      const p2 = q[(i + 1) % q.length];
      area += p1.x * p2.y - p2.x * p1.y;
    }
    return Math.abs(area) / 2;
  }

  function rectangleScore(pts) {
    const q = orderPoints(pts);
    const top = dist(q[0], q[1]);
    const right = dist(q[1], q[2]);
    const bottom = dist(q[2], q[3]);
    const left = dist(q[3], q[0]);

    const widthConsistency = 1 - Math.min(1, Math.abs(top - bottom) / Math.max(top, bottom, 1));
    const heightConsistency = 1 - Math.min(1, Math.abs(left - right) / Math.max(left, right, 1));

    const angles = [];
    for (let i = 0; i < 4; i++) {
      const a = q[(i + 3) % 4];
      const b = q[i];
      const c = q[(i + 1) % 4];
      angles.push(rightAngleScore(a, b, c));
    }

    const angleScore = angles.reduce((s, v) => s + v, 0) / 4;
    return 0.35 * widthConsistency + 0.35 * heightConsistency + 0.30 * angleScore;
  }

  function rightAngleScore(a, b, c) {
    const v1x = a.x - b.x;
    const v1y = a.y - b.y;
    const v2x = c.x - b.x;
    const v2y = c.y - b.y;
    const dot = v1x * v2x + v1y * v2y;
    const l1 = Math.hypot(v1x, v1y);
    const l2 = Math.hypot(v2x, v2y);
    const cos = Math.abs(dot / Math.max(1, l1 * l2));
    return 1 - Math.min(1, cos);
  }

  function a4RatioScore(pts) {
    const q = orderPoints(pts);
    const w1 = dist(q[0], q[1]);
    const w2 = dist(q[3], q[2]);
    const h1 = dist(q[0], q[3]);
    const h2 = dist(q[1], q[2]);

    const ww = Math.max(1, (w1 + w2) / 2);
    const hh = Math.max(1, (h1 + h2) / 2);
    const ratio = Math.max(hh / ww, ww / hh);

    // A4뿐 아니라 엑셀/모니터 표처럼 넓은 사각형도 살림.
    const targets = [1.414, 1.6, 1.78, 2.0, 2.35];
    let best = 0.45;

    for (const target of targets) {
      const diff = Math.abs(ratio - target);
      let score;
      if (diff < 0.16) score = 1.45;
      else if (diff < 0.30) score = 1.22;
      else if (diff < 0.50) score = 1.0;
      else if (diff < 0.80) score = 0.72;
      else score = 0.45;
      best = Math.max(best, score);
    }

    return best;
  }

  function centerBiasScore(pts) {
    const q = orderPoints(pts);
    const cx = (q[0].x + q[1].x + q[2].x + q[3].x) / 4;
    const cy = (q[0].y + q[1].y + q[2].y + q[3].y) / 4;

    const dx = Math.abs(cx - imageW / 2) / imageW;
    const dy = Math.abs(cy - imageH / 2) / imageH;

    return Math.max(0.55, 1.18 - (dx + dy) * 1.15);
  }

  function expandPoints(pts, maxW, maxH, ratio) {
    const q = orderPoints(pts);
    const cx = (q[0].x + q[1].x + q[2].x + q[3].x) / 4;
    const cy = (q[0].y + q[1].y + q[2].y + q[3].y) / 4;

    return q.map(p => ({
      x: clamp(p.x + (p.x - cx) * ratio, 0, maxW),
      y: clamp(p.y + (p.y - cy) * ratio, 0, maxH)
    }));
  }

  function makeA4CenterPoints() {
    const imgRatio = imageH / imageW;
    const a4Ratio = 1.41421356;

    let boxW;
    let boxH;

    if (imgRatio >= 1) {
      boxH = imageH * 0.76;
      boxW = boxH / a4Ratio;
      if (boxW > imageW * 0.82) {
        boxW = imageW * 0.82;
        boxH = boxW * a4Ratio;
      }
    } else {
      boxW = imageW * 0.76;
      boxH = boxW / a4Ratio;
      if (boxH > imageH * 0.82) {
        boxH = imageH * 0.82;
        boxW = boxH * a4Ratio;
      }
    }

    const left = (imageW - boxW) / 2;
    const top = (imageH - boxH) / 2;
    const right = left + boxW;
    const bottom = top + boxH;

    return [
      { x: left, y: top },
      { x: right, y: top },
      { x: right, y: bottom },
      { x: left, y: bottom }
    ];
  }

  function makeDewarpDataUrl(inputPoints) {
    const q = orderPoints(inputPoints);

    let outW = Math.max(100, Math.round(Math.max(dist(q[0], q[1]), dist(q[3], q[2]))));
    let outH = Math.max(100, Math.round(Math.max(dist(q[0], q[3]), dist(q[1], q[2]))));

    const profile = sizeProfiles[sizeMode.value] || sizeProfiles.mid;
    const longSide = Math.max(outW, outH);

    if (longSide > profile.maxSide) {
      const ratio = profile.maxSide / longSide;
      outW = Math.round(outW * ratio);
      outH = Math.round(outH * ratio);
    }

    const out = document.createElement("canvas");
    out.width = outW;
    out.height = outH;

    const octx = out.getContext("2d", { willReadFrequently: true });
    octx.fillStyle = "white";
    octx.fillRect(0, 0, outW, outH);

    warpQuadToRect(octx, img, q, outW, outH, 48);
    applyFilterToCanvas(out, filterMode.value);

    const dataUrl = out.toDataURL("image/jpeg", profile.quality);
    const base64 = dataUrl.split(",")[1];
    const blob = base64ToBlob(base64, "image/jpeg");

    return { dataUrl, blob };
  }

  function applyFilterToCanvas(canvasEl, mode) {
    if (mode === "original") return;

    const c = canvasEl.getContext("2d", { willReadFrequently: true });
    const imgData = c.getImageData(0, 0, canvasEl.width, canvasEl.height);
    const data = imgData.data;

    if (mode === "vflat") {
      applyVFlatFilter(data, canvasEl.width, canvasEl.height);
    } else if (mode === "camscanner") {
      applyCamScannerFilter(data, canvasEl.width, canvasEl.height);
    } else if (mode === "bright") {
      adjustBrightnessContrast(data, 18, 1.12);
    } else if (mode === "gray") {
      grayscale(data, 1.22, 8);
    } else if (mode === "deepgray") {
      deepBlackWhite(data);
    } else if (mode === "sharp") {
      adjustBrightnessContrast(data, 8, 1.18);
      c.putImageData(imgData, 0, 0);
      sharpenCanvas(canvasEl);
      return;
    } else if (mode === "shadow") {
      normalizeShadow(data, canvasEl.width, canvasEl.height);
    } else {
      autoEnhance(data);
    }

    c.putImageData(imgData, 0, 0);
  }

  function applyVFlatFilter(data, w, h) {
    // 모니터/엑셀/정책표 박스용: 색은 많이 죽이지 않고 글자와 표선 대비를 올림.
    for (let i = 0; i < data.length; i += 4) {
      const r = data[i];
      const g = data[i + 1];
      const b = data[i + 2];

      let gray = 0.299 * r + 0.587 * g + 0.114 * b;

      // 모니터 촬영 특유의 회색 바탕을 밝히고 표선/글자를 살림
      let contrast = 1.24;
      let bright = 18;

      let nr = clamp((r - 128) * contrast + 128 + bright, 0, 255);
      let ng = clamp((g - 128) * contrast + 128 + bright, 0, 255);
      let nb = clamp((b - 128) * contrast + 128 + bright, 0, 255);

      // 과한 색 번짐 줄이기
      data[i] = clamp(nr * 0.72 + gray * 0.28, 0, 255);
      data[i + 1] = clamp(ng * 0.72 + gray * 0.28, 0, 255);
      data[i + 2] = clamp(nb * 0.72 + gray * 0.28, 0, 255);
    }
  }

  function applyCamScannerFilter(data, w, h) {
    // 종이 문서용: 배경은 더 하얗게, 글자는 더 진하게.
    normalizeShadow(data, w, h);

    for (let i = 0; i < data.length; i += 4) {
      let gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];

      gray = clamp((gray - 128) * 1.34 + 166, 0, 255);

      if (gray > 215) gray = 255;
      if (gray < 92) gray = Math.max(0, gray - 18);

      data[i] = data[i + 1] = data[i + 2] = gray;
    }
  }

  function adjustBrightnessContrast(data, brightness, contrast) {
    for (let i = 0; i < data.length; i += 4) {
      data[i] = clamp((data[i] - 128) * contrast + 128 + brightness, 0, 255);
      data[i + 1] = clamp((data[i + 1] - 128) * contrast + 128 + brightness, 0, 255);
      data[i + 2] = clamp((data[i + 2] - 128) * contrast + 128 + brightness, 0, 255);
    }
  }

  function grayscale(data, contrast = 1, brightness = 0) {
    for (let i = 0; i < data.length; i += 4) {
      let v = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
      v = clamp((v - 128) * contrast + 128 + brightness, 0, 255);
      data[i] = data[i + 1] = data[i + 2] = v;
    }
  }

  function deepBlackWhite(data) {
    for (let i = 0; i < data.length; i += 4) {
      const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
      const v = gray > 162 ? 255 : 0;
      data[i] = data[i + 1] = data[i + 2] = v;
    }
  }

  function autoEnhance(data) {
    for (let i = 0; i < data.length; i += 4) {
      let r = data[i], g = data[i + 1], b = data[i + 2];
      r = clamp((r - 128) * 1.16 + 145, 0, 255);
      g = clamp((g - 128) * 1.16 + 145, 0, 255);
      b = clamp((b - 128) * 1.16 + 145, 0, 255);
      data[i] = r;
      data[i + 1] = g;
      data[i + 2] = b;
    }
  }

  function normalizeShadow(data, w, h) {
    const sampleStep = 12;
    let total = 0;
    let count = 0;

    for (let y = 0; y < h; y += sampleStep) {
      for (let x = 0; x < w; x += sampleStep) {
        const i = (y * w + x) * 4;
        total += (data[i] + data[i + 1] + data[i + 2]) / 3;
        count++;
      }
    }

    const avg = total / Math.max(1, count);

    for (let i = 0; i < data.length; i += 4) {
      const gray = (data[i] + data[i + 1] + data[i + 2]) / 3;
      const boost = avg - gray;
      let v = gray + boost * 0.35;
      v = clamp((v - 128) * 1.22 + 155, 0, 255);
      data[i] = data[i + 1] = data[i + 2] = v;
    }
  }

  function sharpenCanvas(canvasEl) {
    const c = canvasEl.getContext("2d", { willReadFrequently: true });
    const src = c.getImageData(0, 0, canvasEl.width, canvasEl.height);
    const dst = c.createImageData(src.width, src.height);
    const w = src.width;
    const h = src.height;
    const s = src.data;
    const d = dst.data;

    const kernel = [0, -1, 0, -1, 5, -1, 0, -1, 0];

    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        for (let cidx = 0; cidx < 3; cidx++) {
          let val = 0;
          let k = 0;

          for (let ky = -1; ky <= 1; ky++) {
            for (let kx = -1; kx <= 1; kx++) {
              const idx = ((y + ky) * w + (x + kx)) * 4 + cidx;
              val += s[idx] * kernel[k++];
            }
          }

          d[(y * w + x) * 4 + cidx] = clamp(val, 0, 255);
        }
        d[(y * w + x) * 4 + 3] = 255;
      }
    }

    c.putImageData(dst, 0, 0);
  }

  function base64ToBlob(base64, type) {
    const bin = atob(base64);
    const len = bin.length;
    const bytes = new Uint8Array(len);

    for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);

    return new Blob([bytes], { type });
  }

  function orderPoints(pts) {
    const arr = pts.map(p => ({ x: p.x, y: p.y }));
    const sums = arr.map(p => p.x + p.y);
    const diffs = arr.map(p => p.y - p.x);

    return [
      arr[indexMin(sums)],
      arr[indexMin(diffs)],
      arr[indexMax(sums)],
      arr[indexMax(diffs)]
    ];
  }

  function indexMin(a) {
    let idx = 0;
    for (let i = 1; i < a.length; i++) if (a[i] < a[idx]) idx = i;
    return idx;
  }

  function indexMax(a) {
    let idx = 0;
    for (let i = 1; i < a.length; i++) if (a[i] > a[idx]) idx = i;
    return idx;
  }

  function dist(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
  }

  function bilinear(tl, tr, br, bl, u, v) {
    return {
      x:
        tl.x * (1 - u) * (1 - v) +
        tr.x * u * (1 - v) +
        br.x * u * v +
        bl.x * (1 - u) * v,
      y:
        tl.y * (1 - u) * (1 - v) +
        tr.y * u * (1 - v) +
        br.y * u * v +
        bl.y * (1 - u) * v
    };
  }

  function warpQuadToRect(octx, sourceImg, quad, outW, outH, grid) {
    const [tl, tr, br, bl] = quad;

    for (let gy = 0; gy < grid; gy++) {
      for (let gx = 0; gx < grid; gx++) {
        const u0 = gx / grid;
        const v0 = gy / grid;
        const u1 = (gx + 1) / grid;
        const v1 = (gy + 1) / grid;

        const s00 = bilinear(tl, tr, br, bl, u0, v0);
        const s10 = bilinear(tl, tr, br, bl, u1, v0);
        const s11 = bilinear(tl, tr, br, bl, u1, v1);
        const s01 = bilinear(tl, tr, br, bl, u0, v1);

        const d00 = { x: u0 * outW, y: v0 * outH };
        const d10 = { x: u1 * outW, y: v0 * outH };
        const d11 = { x: u1 * outW, y: v1 * outH };
        const d01 = { x: u0 * outW, y: v1 * outH };

        drawTriangle(octx, sourceImg, s00, s10, s11, d00, d10, d11);
        drawTriangle(octx, sourceImg, s00, s11, s01, d00, d11, d01);
      }
    }
  }

  function drawTriangle(ctx, image, s0, s1, s2, d0, d1, d2) {
    ctx.save();

    ctx.beginPath();
    ctx.moveTo(d0.x, d0.y);
    ctx.lineTo(d1.x, d1.y);
    ctx.lineTo(d2.x, d2.y);
    ctx.closePath();
    ctx.clip();

    const m = affineFromTriangles(s0, s1, s2, d0, d1, d2);
    ctx.setTransform(m.a, m.b, m.c, m.d, m.e, m.f);
    ctx.drawImage(image, 0, 0);

    ctx.restore();
  }

  function affineFromTriangles(s0, s1, s2, d0, d1, d2) {
    const sx0 = s0.x, sy0 = s0.y;
    const sx1 = s1.x, sy1 = s1.y;
    const sx2 = s2.x, sy2 = s2.y;

    const dx0 = d0.x, dy0 = d0.y;
    const dx1 = d1.x, dy1 = d1.y;
    const dx2 = d2.x, dy2 = d2.y;

    const denom =
      sx0 * (sy1 - sy2) +
      sx1 * (sy2 - sy0) +
      sx2 * (sy0 - sy1);

    if (Math.abs(denom) < 0.000001) {
      return { a: 1, b: 0, c: 0, d: 1, e: 0, f: 0 };
    }

    const a =
      (dx0 * (sy1 - sy2) +
       dx1 * (sy2 - sy0) +
       dx2 * (sy0 - sy1)) / denom;

    const c =
      (dx0 * (sx2 - sx1) +
       dx1 * (sx0 - sx2) +
       dx2 * (sx1 - sx0)) / denom;

    const e =
      (dx0 * (sx1 * sy2 - sx2 * sy1) +
       dx1 * (sx2 * sy0 - sx0 * sy2) +
       dx2 * (sx0 * sy1 - sx1 * sy0)) / denom;

    const b =
      (dy0 * (sy1 - sy2) +
       dy1 * (sy2 - sy0) +
       dy2 * (sy0 - sy1)) / denom;

    const d =
      (dy0 * (sx2 - sx1) +
       dy1 * (sx0 - sx2) +
       dy2 * (sx1 - sx0)) / denom;

    const f =
      (dy0 * (sx1 * sy2 - sx2 * sy1) +
       dy1 * (sx2 * sy0 - sx0 * sy2) +
       dy2 * (sx0 * sy1 - sx1 * sy0)) / denom;

    return { a, b, c, d, e, f };
  }

  window.addEventListener("resize", resizeCanvas);
  showReviewMode();
})();
</script>
