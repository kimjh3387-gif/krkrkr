<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>이미지 펴기</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #020617;
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overscroll-behavior: none;
    }

    header {
      padding: 14px 12px 8px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.04em;
    }

    .sub {
      margin-top: 5px;
      color: #94a3b8;
      font-size: 12px;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 10px;
      background: rgba(2, 6, 23, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(148, 163, 184, 0.25);
    }

    .navrow {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      padding: 0 10px 10px;
      background: rgba(2, 6, 23, 0.9);
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
    }

    button,
    label {
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: linear-gradient(180deg, #1f2937, #111827);
      color: #e5e7eb;
      border-radius: 14px;
      padding: 12px 10px;
      font-size: 14px;
      font-weight: 800;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    button.primary {
      background: linear-gradient(180deg, #0ea5e9, #0369a1);
      border-color: #7dd3fc;
    }

    button.good {
      background: linear-gradient(180deg, #22c55e, #15803d);
      border-color: #86efac;
    }

    button:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    input[type="file"] { display: none; }

    .stage-wrap { padding: 10px; }

    .stage {
      position: relative;
      width: 100%;
      height: 58vh;
      background: #000;
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 18px;
      overflow: hidden;
      touch-action: none;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #magnifier {
      position: fixed;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.92);
      background: #000;
      z-index: 999;
      display: none;
      pointer-events: none;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    .hint {
      padding: 8px 14px 16px;
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.55;
    }

    .status {
      padding: 0 14px 8px;
      color: #bae6fd;
      font-size: 12px;
      min-height: 18px;
    }

    .result-box {
      display: none;
      padding: 10px;
    }

    .result-box.show { display: block; }

    .result-box img {
      width: 100%;
      background: white;
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.25);
    }

    .download {
      display: block;
      margin-top: 10px;
      padding: 14px;
      border-radius: 14px;
      text-align: center;
      color: white;
      text-decoration: none;
      font-weight: 900;
      background: linear-gradient(180deg, #22c55e, #15803d);
    }

    .small {
      color: #64748b;
      font-size: 12px;
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>

<body>
<header>
  <h1>이미지 펴기</h1>
  <div class="sub">사진 선택 → 자동 자르기 → 자동 펴기 → 저장</div>
</header>

<div class="toolbar">
  <label for="fileInput">사진 여러 장 선택</label>
  <button id="cameraBtn">카메라 촬영</button>
  <button id="autoBtn" disabled>자동 영역</button>
  <button id="dewarpBtn" class="primary" disabled>다시 펴기</button>
</div>

<div class="navrow">
  <button id="prevBtn" disabled>이전</button>
  <button id="countBtn" disabled>0 / 0</button>
  <button id="nextBtn" disabled>다음</button>
</div>

<input id="fileInput" type="file" accept="image/*" multiple />
<input id="cameraInput" type="file" accept="image/*" capture="environment" />

<div class="status" id="status">OpenCV 로딩 중...</div>

<div class="stage-wrap">
  <div class="stage" id="stage">
    <canvas id="canvas"></canvas>
  </div>
</div>

<canvas id="magnifier"></canvas>

<div class="hint">
  사진을 선택하면 자동으로 문서 외곽을 잡고 바로 펴진 결과를 만든다.<br>
  자동 영역이 살짝 틀리면 노란 점을 옮긴 뒤 <b>다시 펴기</b>를 누르면 된다.
</div>

<div class="result-box" id="resultBox">
  <img id="resultImg" alt="펴진 이미지" />
  <a id="downloadLink" class="download" download="dewarped.png">현재 이미지 저장</a>
  <div class="small">아이폰 Safari에서는 이미지 길게 누르기 → 사진에 저장이 더 안정적일 수 있음</div>
</div>

<script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvLoaded();"></script>

<script>
(() => {
  window.cvReady = false;

  window.onOpenCvLoaded = function () {
    if (typeof cv === "undefined") {
      setStatus("OpenCV 로딩 실패. 기본 자동영역으로 작동합니다.");
      return;
    }

    cv["onRuntimeInitialized"] = () => {
      window.cvReady = true;
      setStatus("OpenCV 준비 완료. 사진을 선택하세요.");
    };
  };

  const stage = document.getElementById("stage");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const magnifier = document.getElementById("magnifier");
  const magCtx = magnifier.getContext("2d");

  const fileInput = document.getElementById("fileInput");
  const cameraInput = document.getElementById("cameraInput");
  const cameraBtn = document.getElementById("cameraBtn");
  const autoBtn = document.getElementById("autoBtn");
  const dewarpBtn = document.getElementById("dewarpBtn");

  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const countBtn = document.getElementById("countBtn");

  const resultBox = document.getElementById("resultBox");
  const resultImg = document.getElementById("resultImg");
  const downloadLink = document.getElementById("downloadLink");
  const statusEl = document.getElementById("status");

  let files = [];
  let currentIndex = 0;

  let img = new Image();
  let loaded = false;
  let imageW = 0;
  let imageH = 0;

  let view = { x: 0, y: 0, w: 0, h: 0, scale: 1 };
  let points = [];
  let dragging = -1;

  function setStatus(text) {
    statusEl.textContent = text;
  }

  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const r = stage.getBoundingClientRect();

    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    canvas.style.width = r.width + "px";
    canvas.style.height = r.height + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    magnifier.width = 220 * dpr;
    magnifier.height = 220 * dpr;
    magCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (loaded) fitView();
    draw();
  }

  function fitView() {
    const r = stage.getBoundingClientRect();
    const pad = 12;

    const scale = Math.min(
      (r.width - pad * 2) / imageW,
      (r.height - pad * 2) / imageH
    );

    view.scale = scale;
    view.w = imageW * scale;
    view.h = imageH * scale;
    view.x = (r.width - view.w) / 2;
    view.y = (r.height - view.h) / 2;
  }

  function imgToScreen(p) {
    return {
      x: view.x + p.x * view.scale,
      y: view.y + p.y * view.scale
    };
  }

  function screenToImg(x, y) {
    return {
      x: clamp((x - view.x) / view.scale, 0, imageW),
      y: clamp((y - view.y) / view.scale, 0, imageH)
    };
  }

  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  function draw() {
    const r = stage.getBoundingClientRect();

    ctx.clearRect(0, 0, r.width, r.height);
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, r.width, r.height);

    if (!loaded) {
      ctx.fillStyle = "#94a3b8";
      ctx.font = "14px -apple-system";
      ctx.textAlign = "center";
      ctx.fillText("사진을 선택하세요", r.width / 2, r.height / 2);
      return;
    }

    ctx.drawImage(img, view.x, view.y, view.w, view.h);

    const sp = points.map(imgToScreen);

    ctx.beginPath();
    ctx.moveTo(sp[0].x, sp[0].y);
    for (let i = 1; i < 4; i++) ctx.lineTo(sp[i].x, sp[i].y);
    ctx.closePath();
    ctx.fillStyle = "rgba(20, 184, 166, 0.13)";
    ctx.fill();
    ctx.strokeStyle = "#14f1c8";
    ctx.lineWidth = 3;
    ctx.stroke();

    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.arc(sp[i].x, sp[i].y, 13, 0, Math.PI * 2);
      ctx.fillStyle = "#facc15";
      ctx.fill();
      ctx.strokeStyle = "#020617";
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = "#020617";
      ctx.font = "bold 12px -apple-system";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(i + 1, sp[i].x, sp[i].y);
    }
  }

  function showMagnifier(touchX, touchY, imgPoint) {
    const size = 220;
    const zoom = 1.0;
    const sourceSize = size / zoom;

    let left = touchX - size / 2;
    let top = touchY - size - 24;

    if (top < 10) top = touchY + 24;
    if (left < 8) left = 8;
    if (left + size > window.innerWidth - 8) {
      left = window.innerWidth - size - 8;
    }

    magnifier.style.width = size + "px";
    magnifier.style.height = size + "px";
    magnifier.style.left = left + "px";
    magnifier.style.top = top + "px";
    magnifier.style.display = "block";

    magCtx.clearRect(0, 0, size, size);
    magCtx.save();

    magCtx.beginPath();
    magCtx.arc(size / 2, size / 2, size / 2 - 4, 0, Math.PI * 2);
    magCtx.clip();

    magCtx.fillStyle = "#000";
    magCtx.fillRect(0, 0, size, size);

    magCtx.drawImage(
      img,
      imgPoint.x - sourceSize / 2,
      imgPoint.y - sourceSize / 2,
      sourceSize,
      sourceSize,
      0,
      0,
      size,
      size
    );

    magCtx.strokeStyle = "rgba(255,255,255,0.95)";
    magCtx.lineWidth = 2;

    magCtx.beginPath();
    magCtx.moveTo(size / 2, 0);
    magCtx.lineTo(size / 2, size);
    magCtx.moveTo(0, size / 2);
    magCtx.lineTo(size, size / 2);
    magCtx.stroke();

    magCtx.restore();
  }

  function hideMagnifier() {
    magnifier.style.display = "none";
  }

  function getPos(e) {
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;

    return {
      x: t.clientX - r.left,
      y: t.clientY - r.top,
      pageX: t.clientX,
      pageY: t.clientY
    };
  }

  function nearestPoint(x, y) {
    let best = -1;
    let bestDist = Infinity;

    for (let i = 0; i < points.length; i++) {
      const p = imgToScreen(points[i]);
      const d = Math.hypot(p.x - x, p.y - y);

      if (d < bestDist) {
        bestDist = d;
        best = i;
      }
    }

    return bestDist <= 48 ? best : -1;
  }

  function onDown(e) {
    if (!loaded) return;
    e.preventDefault();

    const p = getPos(e);
    dragging = nearestPoint(p.x, p.y);

    if (dragging >= 0) {
      showMagnifier(p.pageX, p.pageY, points[dragging]);
    }
  }

  function onMove(e) {
    if (!loaded || dragging < 0) return;
    e.preventDefault();

    const p = getPos(e);
    points[dragging] = screenToImg(p.x, p.y);

    draw();
    showMagnifier(p.pageX, p.pageY, points[dragging]);
  }

  function onUp() {
    if (dragging >= 0) {
      autoDewarpCurrent(false);
    }

    dragging = -1;
    hideMagnifier();
  }

  canvas.addEventListener("mousedown", onDown);
  canvas.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);

  canvas.addEventListener("touchstart", onDown, { passive: false });
  canvas.addEventListener("touchmove", onMove, { passive: false });
  canvas.addEventListener("touchend", onUp, { passive: false });
  canvas.addEventListener("touchcancel", onUp, { passive: false });

  function updateNavButtons() {
    const total = files.length || 0;
    countBtn.textContent = total ? `${currentIndex + 1} / ${total}` : "0 / 0";

    prevBtn.disabled = total <= 1 || currentIndex <= 0;
    nextBtn.disabled = total <= 1 || currentIndex >= total - 1;
    countBtn.disabled = total === 0;
  }

  function loadFiles(fileList) {
    files = Array.from(fileList || []);
    currentIndex = 0;

    if (!files.length) return;

    updateNavButtons();
    loadCurrentFile();
  }

  function loadCurrentFile() {
    const file = files[currentIndex];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = () => {
      img = new Image();

      img.onload = () => {
        imageW = img.naturalWidth;
        imageH = img.naturalHeight;
        loaded = true;

        fitView();
        points = autoDetectDocumentPoints();

        autoBtn.disabled = false;
        dewarpBtn.disabled = false;

        resultBox.classList.remove("show");
        resultImg.removeAttribute("src");
        downloadLink.removeAttribute("href");

        updateNavButtons();
        draw();

        const name = file.name || "image";
        setStatus(`${currentIndex + 1}/${files.length} 자동 영역 선택 완료: ${name}`);

        autoDewarpCurrent(true);
      };

      img.src = reader.result;
    };

    reader.readAsDataURL(file);
  }

  fileInput.addEventListener("change", e => loadFiles(e.target.files));
  cameraInput.addEventListener("change", e => loadFiles(e.target.files));
  cameraBtn.addEventListener("click", () => cameraInput.click());

  prevBtn.addEventListener("click", () => {
    if (currentIndex > 0) {
      currentIndex--;
      loadCurrentFile();
    }
  });

  nextBtn.addEventListener("click", () => {
    if (currentIndex < files.length - 1) {
      currentIndex++;
      loadCurrentFile();
    }
  });

  autoBtn.addEventListener("click", () => {
    if (!loaded) return;
    points = autoDetectDocumentPoints();
    draw();
    autoDewarpCurrent(false);
  });

  dewarpBtn.addEventListener("click", () => autoDewarpCurrent(true));

  function autoDetectDocumentPoints() {
    if (window.cvReady) {
      try {
        const detected = detectDocumentWithOpenCV();

        if (detected && detected.length === 4) {
          return detected;
        }
      } catch (err) {
        console.warn("OpenCV detect failed", err);
      }
    }

    return makeA4CenterPoints();
  }

  function detectDocumentWithOpenCV() {
    const maxSide = 1100;
    const scale = Math.min(maxSide / imageW, maxSide / imageH, 1);
    const w = Math.round(imageW * scale);
    const h = Math.round(imageH * scale);

    const temp = document.createElement("canvas");
    temp.width = w;
    temp.height = h;

    const tctx = temp.getContext("2d", { willReadFrequently: true });
    tctx.drawImage(img, 0, 0, w, h);

    let src = cv.imread(temp);
    let gray = new cv.Mat();
    let blur = new cv.Mat();
    let edges = new cv.Mat();
    let kernel = cv.Mat.ones(5, 5, cv.CV_8U);
    let contours = new cv.MatVector();
    let hierarchy = new cv.Mat();

    try {
      cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
      cv.GaussianBlur(gray, blur, new cv.Size(5, 5), 0);
      cv.Canny(blur, edges, 30, 110);
      cv.dilate(edges, edges, kernel);
      cv.erode(edges, edges, kernel);

      cv.findContours(edges, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

      let best = null;
      let bestScore = 0;
      const imageArea = w * h;

      for (let i = 0; i < contours.size(); i++) {
        const cnt = contours.get(i);
        const area = cv.contourArea(cnt);

        if (area < imageArea * 0.10 || area > imageArea * 0.985) {
          cnt.delete();
          continue;
        }

        const peri = cv.arcLength(cnt, true);

        for (const eps of [0.015, 0.02, 0.025, 0.035, 0.05]) {
          const approx = new cv.Mat();
          cv.approxPolyDP(cnt, approx, eps * peri, true);

          if (approx.rows === 4) {
            const pts = matToPoints(approx).map(p => ({ x: p.x / scale, y: p.y / scale }));
            const ordered = orderPoints(pts);

            const ratioScore = a4RatioScore(ordered);
            const areaScore = area / imageArea;
            const centerScore = centerBiasScore(ordered);
            const score = areaScore * ratioScore * centerScore;

            if (score > bestScore) {
              bestScore = score;
              best = ordered;
            }
          }

          approx.delete();
        }

        cnt.delete();
      }

      if (best && bestScore > 0.035) {
        return expandPoints(best, imageW, imageH, 0.004);
      }

      return detectDocumentByBrightPaper(temp, scale);
    } finally {
      src.delete();
      gray.delete();
      blur.delete();
      edges.delete();
      kernel.delete();
      contours.delete();
      hierarchy.delete();
    }
  }

  function detectDocumentByBrightPaper(temp, scale) {
    const tctx = temp.getContext("2d", { willReadFrequently: true });
    const w = temp.width;
    const h = temp.height;
    const data = tctx.getImageData(0, 0, w, h).data;

    let minX = w;
    let minY = h;
    let maxX = 0;
    let maxY = 0;
    let count = 0;

    const mx = Math.round(w * 0.025);
    const my = Math.round(h * 0.025);

    for (let y = my; y < h - my; y += 2) {
      for (let x = mx; x < w - mx; x += 2) {
        const i = (y * w + x) * 4;
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];

        const brightness = (r + g + b) / 3;
        const colorDiff = Math.max(r, g, b) - Math.min(r, g, b);

        if (brightness > 105 && colorDiff < 125 && r > 80 && g > 80 && b > 70) {
          minX = Math.min(minX, x);
          minY = Math.min(minY, y);
          maxX = Math.max(maxX, x);
          maxY = Math.max(maxY, y);
          count++;
        }
      }
    }

    const bw = maxX - minX;
    const bh = maxY - minY;
    const areaRatio = (bw * bh) / (w * h);

    if (count < 300 || bw < w * 0.25 || bh < h * 0.25 || areaRatio > 0.96) {
      return null;
    }

    return expandPoints([
      { x: minX / scale, y: minY / scale },
      { x: maxX / scale, y: minY / scale },
      { x: maxX / scale, y: maxY / scale },
      { x: minX / scale, y: maxY / scale }
    ], imageW, imageH, 0.004);
  }

  function matToPoints(mat) {
    const pts = [];

    for (let i = 0; i < mat.rows; i++) {
      pts.push({
        x: mat.data32S[i * 2],
        y: mat.data32S[i * 2 + 1]
      });
    }

    return pts;
  }

  function a4RatioScore(pts) {
    const q = orderPoints(pts);
    const w1 = dist(q[0], q[1]);
    const w2 = dist(q[3], q[2]);
    const h1 = dist(q[0], q[3]);
    const h2 = dist(q[1], q[2]);

    const ww = Math.max(1, (w1 + w2) / 2);
    const hh = Math.max(1, (h1 + h2) / 2);
    const ratio = Math.max(hh / ww, ww / hh);
    const target = 1.414;

    const diff = Math.abs(ratio - target);

    if (diff < 0.22) return 1.35;
    if (diff < 0.45) return 1.0;
    if (diff < 0.75) return 0.78;
    return 0.5;
  }

  function centerBiasScore(pts) {
    const q = orderPoints(pts);
    const cx = (q[0].x + q[1].x + q[2].x + q[3].x) / 4;
    const cy = (q[0].y + q[1].y + q[2].y + q[3].y) / 4;

    const dx = Math.abs(cx - imageW / 2) / imageW;
    const dy = Math.abs(cy - imageH / 2) / imageH;

    return 1.15 - Math.min(0.45, dx + dy);
  }

  function expandPoints(pts, maxW, maxH, ratio) {
    const q = orderPoints(pts);
    const cx = (q[0].x + q[1].x + q[2].x + q[3].x) / 4;
    const cy = (q[0].y + q[1].y + q[2].y + q[3].y) / 4;

    return q.map(p => ({
      x: clamp(p.x + (p.x - cx) * ratio, 0, maxW),
      y: clamp(p.y + (p.y - cy) * ratio, 0, maxH)
    }));
  }

  function makeA4CenterPoints() {
    const imgRatio = imageH / imageW;
    const a4Ratio = 1.41421356;

    let boxW;
    let boxH;

    if (imgRatio >= 1) {
      boxH = imageH * 0.76;
      boxW = boxH / a4Ratio;

      if (boxW > imageW * 0.82) {
        boxW = imageW * 0.82;
        boxH = boxW * a4Ratio;
      }
    } else {
      boxW = imageW * 0.76;
      boxH = boxW / a4Ratio;

      if (boxH > imageH * 0.82) {
        boxH = imageH * 0.82;
        boxW = boxH * a4Ratio;
      }
    }

    const left = (imageW - boxW) / 2;
    const top = (imageH - boxH) / 2;
    const right = left + boxW;
    const bottom = top + boxH;

    return [
      { x: left, y: top },
      { x: right, y: top },
      { x: right, y: bottom },
      { x: left, y: bottom }
    ];
  }

  function autoDewarpCurrent(scrollToResult) {
    if (!loaded) return;

    const q = orderPoints(points);

    const outW = Math.max(
      100,
      Math.round(Math.max(dist(q[0], q[1]), dist(q[3], q[2])))
    );

    const outH = Math.max(
      100,
      Math.round(Math.max(dist(q[0], q[3]), dist(q[1], q[2])))
    );

    const out = document.createElement("canvas");
    out.width = outW;
    out.height = outH;

    const octx = out.getContext("2d");
    octx.fillStyle = "white";
    octx.fillRect(0, 0, outW, outH);

    warpQuadToRect(octx, img, q, outW, outH, 64);

    const url = out.toDataURL("image/png");
    resultImg.src = url;
    downloadLink.href = url;

    const baseName = files[currentIndex]?.name?.replace(/\.[^.]+$/, "") || "dewarped";
    downloadLink.download = `${baseName}_dewarped.png`;

    resultBox.classList.add("show");

    if (scrollToResult) {
      setTimeout(() => {
        resultBox.scrollIntoView({ behavior: "smooth", block: "start" });
      }, 150);
    }
  }

  function orderPoints(pts) {
    const arr = pts.map(p => ({ x: p.x, y: p.y }));

    const sums = arr.map(p => p.x + p.y);
    const diffs = arr.map(p => p.y - p.x);

    return [
      arr[indexMin(sums)],
      arr[indexMin(diffs)],
      arr[indexMax(sums)],
      arr[indexMax(diffs)]
    ];
  }

  function indexMin(a) {
    let idx = 0;

    for (let i = 1; i < a.length; i++) {
      if (a[i] < a[idx]) idx = i;
    }

    return idx;
  }

  function indexMax(a) {
    let idx = 0;

    for (let i = 1; i < a.length; i++) {
      if (a[i] > a[idx]) idx = i;
    }

    return idx;
  }

  function dist(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
  }

  function bilinear(tl, tr, br, bl, u, v) {
    return {
      x:
        tl.x * (1 - u) * (1 - v) +
        tr.x * u * (1 - v) +
        br.x * u * v +
        bl.x * (1 - u) * v,
      y:
        tl.y * (1 - u) * (1 - v) +
        tr.y * u * (1 - v) +
        br.y * u * v +
        bl.y * (1 - u) * v
    };
  }

  function warpQuadToRect(octx, sourceImg, quad, outW, outH, grid) {
    const [tl, tr, br, bl] = quad;

    for (let gy = 0; gy < grid; gy++) {
      for (let gx = 0; gx < grid; gx++) {
        const u0 = gx / grid;
        const v0 = gy / grid;
        const u1 = (gx + 1) / grid;
        const v1 = (gy + 1) / grid;

        const s00 = bilinear(tl, tr, br, bl, u0, v0);
        const s10 = bilinear(tl, tr, br, bl, u1, v0);
        const s11 = bilinear(tl, tr, br, bl, u1, v1);
        const s01 = bilinear(tl, tr, br, bl, u0, v1);

        const d00 = { x: u0 * outW, y: v0 * outH };
        const d10 = { x: u1 * outW, y: v0 * outH };
        const d11 = { x: u1 * outW, y: v1 * outH };
        const d01 = { x: u0 * outW, y: v1 * outH };

        drawTriangle(octx, sourceImg, s00, s10, s11, d00, d10, d11);
        drawTriangle(octx, sourceImg, s00, s11, s01, d00, d11, d01);
      }
    }
  }

  function drawTriangle(ctx, image, s0, s1, s2, d0, d1, d2) {
    ctx.save();

    ctx.beginPath();
    ctx.moveTo(d0.x, d0.y);
    ctx.lineTo(d1.x, d1.y);
    ctx.lineTo(d2.x, d2.y);
    ctx.closePath();
    ctx.clip();

    const m = affineFromTriangles(s0, s1, s2, d0, d1, d2);
    ctx.setTransform(m.a, m.b, m.c, m.d, m.e, m.f);
    ctx.drawImage(image, 0, 0);

    ctx.restore();
  }

  function affineFromTriangles(s0, s1, s2, d0, d1, d2) {
    const sx0 = s0.x, sy0 = s0.y;
    const sx1 = s1.x, sy1 = s1.y;
    const sx2 = s2.x, sy2 = s2.y;

    const dx0 = d0.x, dy0 = d0.y;
    const dx1 = d1.x, dy1 = d1.y;
    const dx2 = d2.x, dy2 = d2.y;

    const denom =
      sx0 * (sy1 - sy2) +
      sx1 * (sy2 - sy0) +
      sx2 * (sy0 - sy1);

    if (Math.abs(denom) < 0.000001) {
      return { a: 1, b: 0, c: 0, d: 1, e: 0, f: 0 };
    }

    const a =
      (dx0 * (sy1 - sy2) +
       dx1 * (sy2 - sy0) +
       dx2 * (sy0 - sy1)) / denom;

    const c =
      (dx0 * (sx2 - sx1) +
       dx1 * (sx0 - sx2) +
       dx2 * (sx1 - sx0)) / denom;

    const e =
      (dx0 * (sx1 * sy2 - sx2 * sy1) +
       dx1 * (sx2 * sy0 - sx0 * sy2) +
       dx2 * (sx0 * sy1 - sx1 * sy0)) / denom;

    const b =
      (dy0 * (sy1 - sy2) +
       dy1 * (sy2 - sy0) +
       dy2 * (sy0 - sy1)) / denom;

    const d =
      (dy0 * (sx2 - sx1) +
       dy1 * (sx0 - sx2) +
       dy2 * (sx1 - sx0)) / denom;

    const f =
      (dy0 * (sx1 * sy2 - sx2 * sy1) +
       dy1 * (sx2 * sy0 - sx0 * sy2) +
       dy2 * (sx0 * sy1 - sx1 * sy0)) / denom;

    return { a, b, c, d, e, f };
  }

  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();
})();
</script>
</body>
</html>
