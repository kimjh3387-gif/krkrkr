<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>이미지 펴기</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #020617;
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overscroll-behavior: none;
    }

    header {
      padding: 14px 12px 8px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 20px;
    }

    .sub {
      margin-top: 5px;
      color: #94a3b8;
      font-size: 12px;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 10px;
      background: rgba(2, 6, 23, 0.88);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(148, 163, 184, 0.25);
    }

    button,
    label {
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: linear-gradient(180deg, #1f2937, #111827);
      color: #e5e7eb;
      border-radius: 14px;
      padding: 12px 10px;
      font-size: 14px;
      font-weight: 800;
      text-align: center;
      cursor: pointer;
    }

    button.primary {
      background: linear-gradient(180deg, #0ea5e9, #0369a1);
      border-color: #7dd3fc;
    }

    button:disabled {
      opacity: 0.45;
    }

    input[type="file"] {
      display: none;
    }

    .stage-wrap {
      padding: 10px;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 68vh;
      background: #000;
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 18px;
      overflow: hidden;
      touch-action: none;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #magnifier {
      position: fixed;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 3px solid #facc15;
      background: #000;
      z-index: 999;
      display: none;
      pointer-events: none;
      box-shadow: 0 12px 40px rgba(0,0,0,0.55);
    }

    .hint {
      padding: 8px 14px 16px;
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.55;
    }

    .result-box {
      display: none;
      padding: 10px;
    }

    .result-box.show {
      display: block;
    }

    .result-box img {
      width: 100%;
      background: white;
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.25);
    }

    .download {
      display: block;
      margin-top: 10px;
      padding: 14px;
      border-radius: 14px;
      text-align: center;
      color: white;
      text-decoration: none;
      font-weight: 900;
      background: linear-gradient(180deg, #22c55e, #15803d);
    }
  </style>
</head>

<body>
<header>
  <h1>이미지 펴기</h1>
  <div class="sub">사진 선택 → 자동 영역 추정 → 꼭짓점 보정 → 펴기</div>
</header>

<div class="toolbar">
  <label for="fileInput">사진 선택</label>
  <button id="cameraBtn">카메라 촬영</button>
  <button id="autoBtn" disabled>자동 영역</button>
  <button id="dewarpBtn" class="primary" disabled>펴기</button>
</div>

<input id="fileInput" type="file" accept="image/*" />
<input id="cameraInput" type="file" accept="image/*" capture="environment" />

<div class="stage-wrap">
  <div class="stage" id="stage">
    <canvas id="canvas"></canvas>
  </div>
</div>

<canvas id="magnifier"></canvas>

<div class="hint">
  노란 점을 손가락으로 움직이면 작은 확대창이 뜬다.<br>
  사진 선택 시 화면 안의 A4/문서처럼 보이는 밝은 사각 영역의 끝을 자동으로 잡는다.
</div>

<div class="result-box" id="resultBox">
  <img id="resultImg" alt="펴진 이미지" />
  <a id="downloadLink" class="download" download="dewarped.png">이미지 저장</a>
</div>

<script>
(() => {
  const stage = document.getElementById("stage");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const magnifier = document.getElementById("magnifier");
  const magCtx = magnifier.getContext("2d");

  const fileInput = document.getElementById("fileInput");
  const cameraInput = document.getElementById("cameraInput");
  const cameraBtn = document.getElementById("cameraBtn");
  const autoBtn = document.getElementById("autoBtn");
  const dewarpBtn = document.getElementById("dewarpBtn");

  const resultBox = document.getElementById("resultBox");
  const resultImg = document.getElementById("resultImg");
  const downloadLink = document.getElementById("downloadLink");

  let img = new Image();
  let loaded = false;
  let imageW = 0;
  let imageH = 0;

  let view = { x: 0, y: 0, w: 0, h: 0, scale: 1 };
  let points = [];
  let dragging = -1;

  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const r = stage.getBoundingClientRect();

    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    canvas.style.width = r.width + "px";
    canvas.style.height = r.height + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    magnifier.width = 110 * dpr;
    magnifier.height = 110 * dpr;
    magCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (loaded) fitView();
    draw();
  }

  function fitView() {
    const r = stage.getBoundingClientRect();
    const pad = 12;
    const scale = Math.min(
      (r.width - pad * 2) / imageW,
      (r.height - pad * 2) / imageH
    );

    view.scale = scale;
    view.w = imageW * scale;
    view.h = imageH * scale;
    view.x = (r.width - view.w) / 2;
    view.y = (r.height - view.h) / 2;
  }

  function imgToScreen(p) {
    return {
      x: view.x + p.x * view.scale,
      y: view.y + p.y * view.scale
    };
  }

  function screenToImg(x, y) {
    return {
      x: clamp((x - view.x) / view.scale, 0, imageW),
      y: clamp((y - view.y) / view.scale, 0, imageH)
    };
  }

  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  function draw() {
    const r = stage.getBoundingClientRect();

    ctx.clearRect(0, 0, r.width, r.height);
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, r.width, r.height);

    if (!loaded) {
      ctx.fillStyle = "#94a3b8";
      ctx.font = "14px -apple-system";
      ctx.textAlign = "center";
      ctx.fillText("사진을 선택하세요", r.width / 2, r.height / 2);
      return;
    }

    ctx.drawImage(img, view.x, view.y, view.w, view.h);

    const sp = points.map(imgToScreen);

    ctx.beginPath();
    ctx.moveTo(sp[0].x, sp[0].y);
    for (let i = 1; i < 4; i++) ctx.lineTo(sp[i].x, sp[i].y);
    ctx.closePath();
    ctx.fillStyle = "rgba(56,189,248,0.16)";
    ctx.fill();
    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 3;
    ctx.stroke();

    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.arc(sp[i].x, sp[i].y, 13, 0, Math.PI * 2);
      ctx.fillStyle = "#facc15";
      ctx.fill();
      ctx.strokeStyle = "#020617";
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = "#020617";
      ctx.font = "bold 12px -apple-system";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(i + 1, sp[i].x, sp[i].y);
    }
  }

  function showMagnifier(touchX, touchY, imgPoint) {
    const size = 110;
    const zoom = 1.05; // 확대 거의 없음: 위치 식별용
    const sourceSize = size / zoom;

    let left = touchX - size / 2;
    let top = touchY - size - 22;

    if (top < 10) top = touchY + 22;
    if (left < 8) left = 8;
    if (left + size > window.innerWidth - 8) {
      left = window.innerWidth - size - 8;
    }

    magnifier.style.width = size + "px";
    magnifier.style.height = size + "px";
    magnifier.style.left = left + "px";
    magnifier.style.top = top + "px";
    magnifier.style.display = "block";

    magCtx.clearRect(0, 0, size, size);
    magCtx.save();

    magCtx.beginPath();
    magCtx.arc(size / 2, size / 2, size / 2 - 3, 0, Math.PI * 2);
    magCtx.clip();

    magCtx.fillStyle = "#000";
    magCtx.fillRect(0, 0, size, size);

    magCtx.drawImage(
      img,
      imgPoint.x - sourceSize / 2,
      imgPoint.y - sourceSize / 2,
      sourceSize,
      sourceSize,
      0,
      0,
      size,
      size
    );

    magCtx.strokeStyle = "#facc15";
    magCtx.lineWidth = 1.5;

    magCtx.beginPath();
    magCtx.moveTo(size / 2, 0);
    magCtx.lineTo(size / 2, size);
    magCtx.moveTo(0, size / 2);
    magCtx.lineTo(size, size / 2);
    magCtx.stroke();

    magCtx.restore();
  }

  function hideMagnifier() {
    magnifier.style.display = "none";
  }

  function getPos(e) {
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return {
      x: t.clientX - r.left,
      y: t.clientY - r.top,
      pageX: t.clientX,
      pageY: t.clientY
    };
  }

  function nearestPoint(x, y) {
    let best = -1;
    let bestDist = Infinity;

    for (let i = 0; i < points.length; i++) {
      const p = imgToScreen(points[i]);
      const d = Math.hypot(p.x - x, p.y - y);
      if (d < bestDist) {
        bestDist = d;
        best = i;
      }
    }

    return bestDist <= 45 ? best : -1;
  }

  function onDown(e) {
    if (!loaded) return;
    e.preventDefault();

    const p = getPos(e);
    dragging = nearestPoint(p.x, p.y);

    if (dragging >= 0) {
      showMagnifier(p.pageX, p.pageY, points[dragging]);
    }
  }

  function onMove(e) {
    if (!loaded || dragging < 0) return;
    e.preventDefault();

    const p = getPos(e);
    points[dragging] = screenToImg(p.x, p.y);

    draw();
    showMagnifier(p.pageX, p.pageY, points[dragging]);
  }

  function onUp() {
    dragging = -1;
    hideMagnifier();
  }

  canvas.addEventListener("mousedown", onDown);
  canvas.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);

  canvas.addEventListener("touchstart", onDown, { passive: false });
  canvas.addEventListener("touchmove", onMove, { passive: false });
  canvas.addEventListener("touchend", onUp, { passive: false });
  canvas.addEventListener("touchcancel", onUp, { passive: false });

  function loadFile(file) {
    if (!file) return;

    const reader = new FileReader();

    reader.onload = () => {
      img = new Image();

      img.onload = () => {
        imageW = img.naturalWidth;
        imageH = img.naturalHeight;
        loaded = true;

        fitView();
        points = autoDetectDocumentPoints();

        autoBtn.disabled = false;
        dewarpBtn.disabled = false;

        resultBox.classList.remove("show");
        draw();
      };

      img.src = reader.result;
    };

    reader.readAsDataURL(file);
  }

  fileInput.addEventListener("change", e => loadFile(e.target.files[0]));
  cameraInput.addEventListener("change", e => loadFile(e.target.files[0]));
  cameraBtn.addEventListener("click", () => cameraInput.click());

  autoBtn.addEventListener("click", () => {
    if (!loaded) return;
    points = autoDetectDocumentPoints();
    draw();
  });

  function autoDetectDocumentPoints() {
    const maxSide = 720;
    const scale = Math.min(maxSide / imageW, maxSide / imageH, 1);
    const w = Math.round(imageW * scale);
    const h = Math.round(imageH * scale);

    const temp = document.createElement("canvas");
    temp.width = w;
    temp.height = h;

    const tctx = temp.getContext("2d", { willReadFrequently: true });
    tctx.drawImage(img, 0, 0, w, h);

    const src = tctx.getImageData(0, 0, w, h);
    const data = src.data;

    // 사진 전체 평균 밝기 계산
    let total = 0;
    let sampleCount = 0;

    for (let y = 0; y < h; y += 4) {
      for (let x = 0; x < w; x += 4) {
        const i = (y * w + x) * 4;
        total += (data[i] + data[i + 1] + data[i + 2]) / 3;
        sampleCount++;
      }
    }

    const avgBrightness = total / Math.max(sampleCount, 1);

    let mask = new Uint8Array(w * h);

    // 1차: 배경보다 밝고 종이처럼 채도가 낮은 영역 탐색
    // 정책표/인쇄물은 보통 배경보다 밝은 큰 덩어리라 이 방식이 가장 가볍고 빠름
    const marginX = Math.round(w * 0.015);
    const marginY = Math.round(h * 0.015);

    for (let y = marginY; y < h - marginY; y++) {
      for (let x = marginX; x < w - marginX; x++) {
        const i = (y * w + x) * 4;
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];

        const brightness = (r + g + b) / 3;
        const colorDiff = Math.max(r, g, b) - Math.min(r, g, b);

        const looksLikePaper =
          brightness > Math.max(105, avgBrightness + 10) &&
          colorDiff < 115 &&
          r > 85 &&
          g > 85 &&
          b > 75;

        if (looksLikePaper) {
          mask[y * w + x] = 1;
        }
      }
    }

    // 2차: 문서 내부의 글자/표 선 때문에 빈 구멍이 많으므로 행/열 투영으로 외곽 추정
    const rowCount = new Array(h).fill(0);
    const colCount = new Array(w).fill(0);

    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        if (mask[y * w + x]) {
          rowCount[y]++;
          colCount[x]++;
        }
      }
    }

    // 연속 구간 중 가장 긴 구간을 문서 후보로 사용
    const rowRange = findBestRange(rowCount, w * 0.10, Math.round(h * 0.015));
    const colRange = findBestRange(colCount, h * 0.10, Math.round(w * 0.015));

    if (!rowRange || !colRange) {
      return makeA4CenterPoints();
    }

    let top = rowRange.start;
    let bottom = rowRange.end;
    let left = colRange.start;
    let right = colRange.end;

    const detectedW = right - left;
    const detectedH = bottom - top;
    const areaRatio = (detectedW * detectedH) / (w * h);

    // 너무 작거나, 반대로 사진 전체를 잡으면 실패 처리
    if (
      detectedW < w * 0.28 ||
      detectedH < h * 0.28 ||
      areaRatio > 0.88
    ) {
      return makeA4CenterPoints();
    }

    // A4 비율에 가까운 경우 문서 끝까지 약간 확장
    const ratio = detectedH / detectedW;
    let padX = detectedW * 0.02;
    let padY = detectedH * 0.02;

    if (ratio > 1.15 && ratio < 1.75) {
      padX = detectedW * 0.03;
      padY = detectedH * 0.025;
    }

    left = clamp(left - padX, 0, w);
    right = clamp(right + padX, 0, w);
    top = clamp(top - padY, 0, h);
    bottom = clamp(bottom + padY, 0, h);

    return [
      { x: left / scale, y: top / scale },
      { x: right / scale, y: top / scale },
      { x: right / scale, y: bottom / scale },
      { x: left / scale, y: bottom / scale }
    ];
  }

  function findBestRange(counts, threshold, bridgeGap) {
    let best = null;
    let start = -1;
    let gap = 0;

    for (let i = 0; i < counts.length; i++) {
      const active = counts[i] >= threshold;

      if (active) {
        if (start < 0) start = i;
        gap = 0;
      } else if (start >= 0) {
        gap++;
        if (gap > bridgeGap) {
          const end = i - gap;
          if (!best || end - start > best.end - best.start) {
            best = { start, end };
          }
          start = -1;
          gap = 0;
        }
      }
    }

    if (start >= 0) {
      const end = counts.length - 1 - gap;
      if (!best || end - start > best.end - best.start) {
        best = { start, end };
      }
    }

    if (!best || best.end <= best.start) return null;
    return best;
  }

  function makeA4CenterPoints() {
    const imgRatio = imageH / imageW;
    const a4Ratio = 1.41421356;

    let boxW;
    let boxH;

    if (imgRatio >= 1) {
      // 세로 사진: 세로 A4 박스를 중앙에 배치
      boxH = imageH * 0.82;
      boxW = boxH / a4Ratio;

      if (boxW > imageW * 0.88) {
        boxW = imageW * 0.88;
        boxH = boxW * a4Ratio;
      }
    } else {
      // 가로 사진: 가로 A4 박스를 중앙에 배치
      boxW = imageW * 0.82;
      boxH = boxW / a4Ratio;

      if (boxH > imageH * 0.88) {
        boxH = imageH * 0.88;
        boxW = boxH * a4Ratio;
      }
    }

    const left = (imageW - boxW) / 2;
    const top = (imageH - boxH) / 2;
    const right = left + boxW;
    const bottom = top + boxH;

    return [
      { x: left, y: top },
      { x: right, y: top },
      { x: right, y: bottom },
      { x: left, y: bottom }
    ];
  }

  dewarpBtn.addEventListener("click", () => {
    if (!loaded) return;

    const q = orderPoints(points);

    const outW = Math.max(
      100,
      Math.round(Math.max(dist(q[0], q[1]), dist(q[3], q[2])))
    );

    const outH = Math.max(
      100,
      Math.round(Math.max(dist(q[0], q[3]), dist(q[1], q[2])))
    );

    const out = document.createElement("canvas");
    out.width = outW;
    out.height = outH;

    const octx = out.getContext("2d");
    octx.fillStyle = "white";
    octx.fillRect(0, 0, outW, outH);

    warpQuadToRect(octx, img, q, outW, outH, 48);

    const url = out.toDataURL("image/png");
    resultImg.src = url;
    downloadLink.href = url;
    resultBox.classList.add("show");

    setTimeout(() => {
      resultBox.scrollIntoView({ behavior: "smooth", block: "start" });
    }, 100);
  });

  function orderPoints(pts) {
    const arr = pts.map(p => ({ x: p.x, y: p.y }));

    const sums = arr.map(p => p.x + p.y);
    const diffs = arr.map(p => p.y - p.x);

    return [
      arr[indexMin(sums)],
      arr[indexMin(diffs)],
      arr[indexMax(sums)],
      arr[indexMax(diffs)]
    ];
  }

  function indexMin(a) {
    let idx = 0;
    for (let i = 1; i < a.length; i++) {
      if (a[i] < a[idx]) idx = i;
    }
    return idx;
  }

  function indexMax(a) {
    let idx = 0;
    for (let i = 1; i < a.length; i++) {
      if (a[i] > a[idx]) idx = i;
    }
    return idx;
  }

  function dist(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
  }

  function bilinear(tl, tr, br, bl, u, v) {
    return {
      x:
        tl.x * (1 - u) * (1 - v) +
        tr.x * u * (1 - v) +
        br.x * u * v +
        bl.x * (1 - u) * v,
      y:
        tl.y * (1 - u) * (1 - v) +
        tr.y * u * (1 - v) +
        br.y * u * v +
        bl.y * (1 - u) * v
    };
  }

  function warpQuadToRect(octx, sourceImg, quad, outW, outH, grid) {
    const [tl, tr, br, bl] = quad;

    for (let gy = 0; gy < grid; gy++) {
      for (let gx = 0; gx < grid; gx++) {
        const u0 = gx / grid;
        const v0 = gy / grid;
        const u1 = (gx + 1) / grid;
        const v1 = (gy + 1) / grid;

        const s00 = bilinear(tl, tr, br, bl, u0, v0);
        const s10 = bilinear(tl, tr, br, bl, u1, v0);
        const s11 = bilinear(tl, tr, br, bl, u1, v1);
        const s01 = bilinear(tl, tr, br, bl, u0, v1);

        const d00 = { x: u0 * outW, y: v0 * outH };
        const d10 = { x: u1 * outW, y: v0 * outH };
        const d11 = { x: u1 * outW, y: v1 * outH };
        const d01 = { x: u0 * outW, y: v1 * outH };

        drawTriangle(octx, sourceImg, s00, s10, s11, d00, d10, d11);
        drawTriangle(octx, sourceImg, s00, s11, s01, d00, d11, d01);
      }
    }
  }

  function drawTriangle(ctx, image, s0, s1, s2, d0, d1, d2) {
    ctx.save();

    ctx.beginPath();
    ctx.moveTo(d0.x, d0.y);
    ctx.lineTo(d1.x, d1.y);
    ctx.lineTo(d2.x, d2.y);
    ctx.closePath();
    ctx.clip();

    const m = affineFromTriangles(s0, s1, s2, d0, d1, d2);
    ctx.setTransform(m.a, m.b, m.c, m.d, m.e, m.f);
    ctx.drawImage(image, 0, 0);

    ctx.restore();
  }

  function affineFromTriangles(s0, s1, s2, d0, d1, d2) {
    const sx0 = s0.x, sy0 = s0.y;
    const sx1 = s1.x, sy1 = s1.y;
    const sx2 = s2.x, sy2 = s2.y;

    const dx0 = d0.x, dy0 = d0.y;
    const dx1 = d1.x, dy1 = d1.y;
    const dx2 = d2.x, dy2 = d2.y;

    const denom =
      sx0 * (sy1 - sy2) +
      sx1 * (sy2 - sy0) +
      sx2 * (sy0 - sy1);

    if (Math.abs(denom) < 0.000001) {
      return { a: 1, b: 0, c: 0, d: 1, e: 0, f: 0 };
    }

    const a =
      (dx0 * (sy1 - sy2) +
       dx1 * (sy2 - sy0) +
       dx2 * (sy0 - sy1)) / denom;

    const c =
      (dx0 * (sx2 - sx1) +
       dx1 * (sx0 - sx2) +
       dx2 * (sx1 - sx0)) / denom;

    const e =
      (dx0 * (sx1 * sy2 - sx2 * sy1) +
       dx1 * (sx2 * sy0 - sx0 * sy2) +
       dx2 * (sx0 * sy1 - sx1 * sy0)) / denom;

    const b =
      (dy0 * (sy1 - sy2) +
       dy1 * (sy2 - sy0) +
       dy2 * (sy0 - sy1)) / denom;

    const d =
      (dy0 * (sx2 - sx1) +
       dy1 * (sx0 - sx2) +
       dy2 * (sx1 - sx0)) / denom;

    const f =
      (dy0 * (sx1 * sy2 - sx2 * sy1) +
       dy1 * (sx2 * sy0 - sx0 * sy2) +
       dy2 * (sx0 * sy1 - sx1 * sy0)) / denom;

    return { a, b, c, d, e, f };
  }

  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();
})();
</script>
