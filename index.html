<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>이미지 펴기</title>

  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel2: #1f2937;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --warn: #facc15;
      --danger: #fb7185;
      --ok: #34d399;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #1e293b 0%, #0f172a 55%, #020617 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      min-height: 100vh;
      padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom);
    }

    header {
      padding: 16px 4px 10px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: -0.04em;
    }

    .sub {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 10px 0;
    }

    button, label.filebtn {
      border: 0;
      border-radius: 14px;
      padding: 13px 10px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      background: var(--panel2);
      text-align: center;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    button.primary, label.filebtn {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #00111f;
    }

    button.ok { background: linear-gradient(135deg, #059669, #34d399); color: #00180f; }
    button.warn { background: linear-gradient(135deg, #ca8a04, #facc15); color: #1b1200; }
    button.danger { background: linear-gradient(135deg, #be123c, #fb7185); color: #21020a; }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    input[type="file"] { display: none; }

    .stage {
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      min-height: 58vh;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 18px 60px rgba(0,0,0,0.25);
    }

    canvas {
      max-width: 100%;
      width: 100%;
      touch-action: none;
      display: block;
    }

    .hint {
      color: var(--muted);
      text-align: center;
      padding: 32px 22px;
      line-height: 1.55;
      font-size: 15px;
    }

    .options {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      background: rgba(17, 24, 39, 0.92);
      padding: 11px 12px;
      border-radius: 14px;
      margin: 10px 0;
      color: var(--muted);
      font-size: 14px;
    }

    .options input {
      transform: scale(1.2);
    }

    .status {
      color: var(--muted);
      font-size: 13px;
      min-height: 20px;
      margin: 8px 3px 14px;
      line-height: 1.45;
    }

    .download {
      display: none;
      margin-top: 8px;
      text-decoration: none;
      color: #00111f;
      background: linear-gradient(135deg, #38bdf8, #a7f3d0);
      border-radius: 14px;
      padding: 14px 12px;
      text-align: center;
      font-weight: 800;
    }

    .small {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
      margin: 10px 3px 14px;
    }
  </style>
</head>

<body>
  <header>
    <h1>이미지 펴기</h1>
    <div class="sub">아이폰 Safari에서 사진을 고르고, 네 귀퉁이를 맞춘 뒤 반듯하게 펴는 간단 스캐너입니다.</div>
  </header>

  <div class="toolbar">
    <label class="filebtn" for="fileInput">사진 선택</label>
    <button id="resetBtn">영역 초기화</button>
    <button id="warpBtn" class="ok" disabled>펴기</button>
    <button id="backBtn" disabled>원본으로</button>
  </div>

  <input id="fileInput" type="file" accept="image/*" />

  <div class="options">
    <label for="enhanceChk">스캔처럼 밝게 보정</label>
    <input id="enhanceChk" type="checkbox" checked />
  </div>

  <div class="stage" id="stage">
    <div class="hint" id="hint">
      사진을 선택하세요.<br>
      문서나 정책표의 네 귀퉁이에 노란 점을 맞추면 됩니다.
    </div>
    <canvas id="canvas" style="display:none;"></canvas>
  </div>

  <a id="downloadLink" class="download" download="dewarped.png">펴진 이미지 저장하기</a>

  <div class="status" id="status"></div>
  <div class="small">
    참고: 이 버전은 사진의 사다리꼴/기울어진 원근을 펴는 용도입니다. 종이가 물결처럼 심하게 휘어진 경우는 완전 복원까지는 어렵습니다.
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const hint = document.getElementById('hint');
    const statusEl = document.getElementById('status');
    const resetBtn = document.getElementById('resetBtn');
    const warpBtn = document.getElementById('warpBtn');
    const backBtn = document.getElementById('backBtn');
    const enhanceChk = document.getElementById('enhanceChk');
    const downloadLink = document.getElementById('downloadLink');

    let originalImg = null;
    let currentImg = null;
    let originalCanvas = document.createElement('canvas');
    let originalCtx = originalCanvas.getContext('2d', { willReadFrequently: true });
    let mode = 'edit';

    let display = {
      scale: 1,
      offsetX: 0,
      offsetY: 0,
      imgW: 0,
      imgH: 0,
      cssW: 0,
      cssH: 0
    };

    let points = [];
    let dragging = -1;

    function setStatus(msg) {
      statusEl.textContent = msg || '';
    }

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function resetPoints() {
      if (!currentImg) return;
      const w = display.imgW;
      const h = display.imgH;
      points = [
        {x: w * 0.06, y: h * 0.06},
        {x: w * 0.94, y: h * 0.06},
        {x: w * 0.94, y: h * 0.94},
        {x: w * 0.06, y: h * 0.94}
      ];
      drawEditor();
      setStatus('노란 점을 문서/표의 네 귀퉁이에 맞춰주세요.');
    }

    function loadImageFromFile(file) {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(url);

        const maxSide = 1800;
        let w = img.naturalWidth;
        let h = img.naturalHeight;
        const scale = Math.min(1, maxSide / Math.max(w, h));
        w = Math.round(w * scale);
        h = Math.round(h * scale);

        originalCanvas.width = w;
        originalCanvas.height = h;
        originalCtx.clearRect(0, 0, w, h);
        originalCtx.drawImage(img, 0, 0, w, h);

        originalImg = originalCanvas;
        currentImg = originalCanvas;
        mode = 'edit';
        downloadLink.style.display = 'none';
        hint.style.display = 'none';
        canvas.style.display = 'block';
        warpBtn.disabled = false;
        backBtn.disabled = true;

        resizeCanvasForImage(w, h);
        resetPoints();
      };
      img.onerror = () => {
        setStatus('이미지를 읽지 못했습니다.');
      };
      img.src = url;
    }

    function resizeCanvasForImage(imgW, imgH) {
      const stage = document.getElementById('stage');
      const maxW = stage.clientWidth;
      const maxH = Math.max(360, Math.floor(window.innerHeight * 0.62));
      const scale = Math.min(maxW / imgW, maxH / imgH, 1);

      const cssW = Math.max(1, Math.floor(imgW * scale));
      const cssH = Math.max(1, Math.floor(imgH * scale));

      const dpr = window.devicePixelRatio || 1;
      canvas.style.width = cssW + 'px';
      canvas.style.height = cssH + 'px';
      canvas.width = Math.floor(cssW * dpr);
      canvas.height = Math.floor(cssH * dpr);

      ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);

      display = { scale, offsetX: 0, offsetY: 0, imgW, imgH, cssW, cssH };
    }

    function drawEditor() {
      if (!currentImg) return;
      resizeCanvasForImage(currentImg.width, currentImg.height);

      ctx.clearRect(0, 0, currentImg.width, currentImg.height);
      ctx.drawImage(currentImg, 0, 0);

      if (mode !== 'edit') return;

      ctx.lineWidth = 4 / display.scale;
      ctx.strokeStyle = '#38bdf8';
      ctx.fillStyle = 'rgba(56, 189, 248, 0.14)';

      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < 4; i++) ctx.lineTo(points[i].x, points[i].y);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      const labels = ['좌상', '우상', '우하', '좌하'];
      for (let i = 0; i < 4; i++) {
        const p = points[i];
        ctx.beginPath();
        ctx.fillStyle = '#facc15';
        ctx.strokeStyle = '#020617';
        ctx.lineWidth = 3 / display.scale;
        ctx.arc(p.x, p.y, 13 / display.scale, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.font = `${14 / display.scale}px -apple-system, BlinkMacSystemFont, sans-serif`;
        ctx.fillStyle = '#f8fafc';
        ctx.strokeStyle = '#020617';
        ctx.lineWidth = 4 / display.scale;
        ctx.strokeText(labels[i], p.x + 16 / display.scale, p.y - 12 / display.scale);
        ctx.fillText(labels[i], p.x + 16 / display.scale, p.y - 12 / display.scale);
      }
    }

    function getCanvasPoint(evt) {
      const rect = canvas.getBoundingClientRect();
      let clientX, clientY;
      if (evt.touches && evt.touches.length > 0) {
        clientX = evt.touches[0].clientX;
        clientY = evt.touches[0].clientY;
      } else {
        clientX = evt.clientX;
        clientY = evt.clientY;
      }
      return {
        x: (clientX - rect.left) / display.scale,
        y: (clientY - rect.top) / display.scale
      };
    }

    function findNearestPoint(pos) {
      let best = -1;
      let bestDist = Infinity;
      const hitRadius = 38 / display.scale;

      for (let i = 0; i < points.length; i++) {
        const dx = points[i].x - pos.x;
        const dy = points[i].y - pos.y;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < bestDist && d < hitRadius) {
          best = i;
          bestDist = d;
        }
      }
      return best;
    }

    function startDrag(evt) {
      if (mode !== 'edit') return;
      evt.preventDefault();
      const pos = getCanvasPoint(evt);
      dragging = findNearestPoint(pos);
    }

    function moveDrag(evt) {
      if (mode !== 'edit' || dragging < 0) return;
      evt.preventDefault();
      const pos = getCanvasPoint(evt);
      points[dragging].x = clamp(pos.x, 0, display.imgW - 1);
      points[dragging].y = clamp(pos.y, 0, display.imgH - 1);
      drawEditor();
    }

    function endDrag() {
      dragging = -1;
    }

    function dist(a, b) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function solveHomography(src, dst) {
      const A = [];
      const b = [];

      for (let i = 0; i < 4; i++) {
        const x = src[i].x, y = src[i].y;
        const u = dst[i].x, v = dst[i].y;

        A.push([x, y, 1, 0, 0, 0, -u*x, -u*y]);
        b.push(u);
        A.push([0, 0, 0, x, y, 1, -v*x, -v*y]);
        b.push(v);
      }

      return gaussianElimination(A, b).concat([1]);
    }

    function gaussianElimination(A, b) {
      const n = b.length;
      for (let i = 0; i < n; i++) {
        let maxRow = i;
        for (let k = i + 1; k < n; k++) {
          if (Math.abs(A[k][i]) > Math.abs(A[maxRow][i])) maxRow = k;
        }

        [A[i], A[maxRow]] = [A[maxRow], A[i]];
        [b[i], b[maxRow]] = [b[maxRow], b[i]];

        const pivot = A[i][i] || 1e-12;
        for (let j = i; j < n; j++) A[i][j] /= pivot;
        b[i] /= pivot;

        for (let k = 0; k < n; k++) {
          if (k === i) continue;
          const factor = A[k][i];
          for (let j = i; j < n; j++) A[k][j] -= factor * A[i][j];
          b[k] -= factor * b[i];
        }
      }
      return b;
    }

    function invert3x3(m) {
      const [a,b,c,d,e,f,g,h,i] = m;
      const A = e*i - f*h;
      const B = -(d*i - f*g);
      const C = d*h - e*g;
      const D = -(b*i - c*h);
      const E = a*i - c*g;
      const F = -(a*h - b*g);
      const G = b*f - c*e;
      const H = -(a*f - c*d);
      const I = a*e - b*d;
      const det = a*A + b*B + c*C;
      if (Math.abs(det) < 1e-12) throw new Error('선택 영역이 너무 찌그러져 있습니다.');
      return [A/det,D/det,G/det,B/det,E/det,H/det,C/det,F/det,I/det];
    }

    function enhanceImageData(imageData) {
      const data = imageData.data;
      const contrast = 1.12;
      const brightness = 9;

      for (let i = 0; i < data.length; i += 4) {
        data[i] = clamp((data[i] - 128) * contrast + 128 + brightness, 0, 255);
        data[i+1] = clamp((data[i+1] - 128) * contrast + 128 + brightness, 0, 255);
        data[i+2] = clamp((data[i+2] - 128) * contrast + 128 + brightness, 0, 255);
      }
      return imageData;
    }

    function warpImage() {
      if (!currentImg || points.length !== 4) return;

      setStatus('이미지를 펴는 중입니다.');

      const [tl, tr, br, bl] = points;
      const outW = Math.max(10, Math.round(Math.max(dist(br, bl), dist(tr, tl))));
      const outH = Math.max(10, Math.round(Math.max(dist(tr, br), dist(tl, bl))));

      const dst = [
        {x: 0, y: 0},
        {x: outW - 1, y: 0},
        {x: outW - 1, y: outH - 1},
        {x: 0, y: outH - 1}
      ];

      const H = solveHomography(points, dst);
      const invH = invert3x3(H);

      const srcCanvas = originalCanvas;
      const srcCtx = originalCtx;
      const srcData = srcCtx.getImageData(0, 0, srcCanvas.width, srcCanvas.height);
      const src = srcData.data;

      const outCanvas = document.createElement('canvas');
      outCanvas.width = outW;
      outCanvas.height = outH;
      const outCtx = outCanvas.getContext('2d', { willReadFrequently: true });
      let outData = outCtx.createImageData(outW, outH);
      const out = outData.data;

      for (let y = 0; y < outH; y++) {
        for (let x = 0; x < outW; x++) {
          const den = invH[6] * x + invH[7] * y + invH[8];
          const sx = (invH[0] * x + invH[1] * y + invH[2]) / den;
          const sy = (invH[3] * x + invH[4] * y + invH[5]) / den;

          const ix = Math.round(sx);
          const iy = Math.round(sy);

          const oi = (y * outW + x) * 4;
          if (ix >= 0 && ix < srcCanvas.width && iy >= 0 && iy < srcCanvas.height) {
            const si = (iy * srcCanvas.width + ix) * 4;
            out[oi] = src[si];
            out[oi+1] = src[si+1];
            out[oi+2] = src[si+2];
            out[oi+3] = 255;
          } else {
            out[oi] = 255;
            out[oi+1] = 255;
            out[oi+2] = 255;
            out[oi+3] = 255;
          }
        }
      }

      if (enhanceChk.checked) {
        outData = enhanceImageData(outData);
      }

      outCtx.putImageData(outData, 0, 0);
      currentImg = outCanvas;
      mode = 'result';

      resizeCanvasForImage(outW, outH);
      ctx.clearRect(0, 0, outW, outH);
      ctx.drawImage(outCanvas, 0, 0);

      outCanvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        downloadLink.href = url;
        downloadLink.style.display = 'block';
        setStatus('완료. 저장 버튼을 길게 눌러 이미지 저장도 가능합니다.');
      }, 'image/png');

      backBtn.disabled = false;
    }

    fileInput.addEventListener('change', e => {
      const file = e.target.files && e.target.files[0];
      if (file) loadImageFromFile(file);
    });

    resetBtn.addEventListener('click', () => {
      if (!originalImg) return;
      currentImg = originalCanvas;
      mode = 'edit';
      downloadLink.style.display = 'none';
      backBtn.disabled = true;
      resizeCanvasForImage(currentImg.width, currentImg.height);
      resetPoints();
    });

    warpBtn.addEventListener('click', warpImage);

    backBtn.addEventListener('click', () => {
      if (!originalImg) return;
      currentImg = originalCanvas;
      mode = 'edit';
      downloadLink.style.display = 'none';
      backBtn.disabled = true;
      resizeCanvasForImage(currentImg.width, currentImg.height);
      drawEditor();
      setStatus('원본으로 돌아왔습니다.');
    });

    canvas.addEventListener('mousedown', startDrag);
    canvas.addEventListener('mousemove', moveDrag);
    window.addEventListener('mouseup', endDrag);

    canvas.addEventListener('touchstart', startDrag, { passive: false });
    canvas.addEventListener('touchmove', moveDrag, { passive: false });
    canvas.addEventListener('touchend', endDrag);
    canvas.addEventListener('touchcancel', endDrag);

    window.addEventListener('resize', () => {
      if (currentImg) drawEditor();
    });
  </script>
</body>
</html>
